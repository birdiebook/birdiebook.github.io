<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- Statusfältet ska smälta in i hubbens ljusa topp, inte i den mörka
     bottenfärgen — värdet är gradientens översta ton. -->
<meta name="theme-color" content="#0c2e22"><!-- = --bg nedan; meta läser inte CSS-variabler -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<script>
"use strict";
/* Entrégrinden (MOLN_PLAN §3 S1): den som aldrig gjort ett val skickas till
 * entre.html en gång. Ligger i <head> och är SYNKRON med flit — en kontroll mot
 * Store/IndexedDB eller Supabase hade varit asynkron och blinkat till hubben
 * först, vilket ser ut som en bugg.
 *
 * Två sätt att räknas som "har redan valt":
 *   1. entre.html:s klarmarkering.
 *   2. En Supabase-session i localStorage. Den finns för alla som använt appen
 *      före den här sidan, och utan den hade varenda befintlig testare mötts av
 *      en entré. Nyckelformen (`sb-<ref>-auth-token`) är Supabases egen och
 *      läses BARA här, som igenkänning — aldrig för att tolka innehållet.
 *
 * Missar igenkänningen ändå någon är priset ett tryck på "Fortsätt som gäst":
 * den befintliga sessionen återanvänds (konto.js `redo`) och ingen data rörs.
 */
(function () {
  try {
    if (window.SGFlytt && window.SGFlytt.frusen()) return;   // frusen Pages-kopia
    if (localStorage.getItem("sg_entre_klar") === "1") return;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && /^sb-.+-auth-token$/.test(k)) return;
    }
    location.replace("./entre.html");
  } catch (_) {}      // utan localStorage: visa hubben, aldrig en vägg
})();
</script>
<title>Birdiebook</title>
<style>
  :root { --bg:#0c2e22; --card:#123c2d; --ink:#e8f5ec; --dim:#9fc4ae;
          --line:#1f5540; --accent:#37b06b; --accent-ink:#06180f;
          --danger:#e26a5a; --good:#7ee2a8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  /* Bakgrunden är appens mörkgröna --bg, samma som alla andra sidor. Hubben bar
     en tid loggans gradient (ljust uppifrån, mörkare nedåt) för att hänga ihop
     med appikonen, men den gjorde menyn till en främmande sida i appen — bytet
     hit tillbaka 2026-08-07 är ett medvetet val av sammanhang framför
     ikon-släktskapet. Glaskorten nedan ligger kvar och läser som ljusare
     paneler mot den solida färgen. */
  body { color:var(--ink);
    background:var(--bg);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { max-width:480px; margin:0 auto; padding:34px 22px 28px;
         display:flex; flex-direction:column; min-height:100%; }
  /* Typografin är referensbildens: en HALVFET rubrik (inte svart — 800 gjorde
     den klumpig) mot etiketter i normal vikt. Det är kontrasten mellan
     vikterna som gör bilden lugn. */
  h1 { font-size:34px; font-weight:600; margin:10px 0 4px; letter-spacing:-.5px; }
  .sub { color:#cfe6d8; font-size:15px; font-weight:400; margin:0 0 26px;
    letter-spacing:-.1px; }

  /* De tre valen. Stora tryckytor: hubben används med handske på, ute,
     ofta i solljus — och den ska aldrig kräva att man siktar.
     Frostat glas i stället för en solid platta: samma kontrast mot texten,
     men bakgrundsgradienten lyser igenom så sidan hänger ihop. */
  .val { position:relative; display:flex; flex-direction:column; justify-content:center;
    min-height:84px; text-decoration:none; color:#fff; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.20), rgba(255,255,255,.09));
    border:1px solid rgba(255,255,255,.30); border-radius:22px;
    /* "Liquid glass": ytterglöd + ljus innerkant uppe och mörkare nere. Det är
       de tre skuggorna tillsammans som ger djupet — tas innerkanten bort blir
       kortet en platt vit slöja. */
    box-shadow:0 10px 26px rgba(0,0,0,.20),
               0 0 22px rgba(190,238,205,.10),
               inset 0 1px 0 rgba(255,255,255,.45),
               inset 0 -1px 0 rgba(0,0,0,.10);
    -webkit-backdrop-filter:blur(12px) saturate(1.2);
    backdrop-filter:blur(12px) saturate(1.2);
    padding:16px 20px; margin-bottom:14px;
    transition:transform .12s ease, box-shadow .12s ease; }
  /* Glansen: ett svagt ljus som ligger över kortets övre halva och rinner ut. */
  .val::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 90% at 12% -30%, rgba(255,255,255,.34), rgba(255,255,255,0) 60%),
      linear-gradient(to bottom, rgba(255,255,255,.10), rgba(255,255,255,0) 52%); }
  .val:active { transform:scale(.985);
    box-shadow:0 6px 16px rgba(0,0,0,.22),
               0 0 30px rgba(190,238,205,.18),
               inset 0 1px 0 rgba(255,255,255,.55); }
  .val .rad { position:relative; display:flex; align-items:center; gap:16px; }
  .val .ico { width:34px; height:34px; flex:none; display:block; color:#eaf6ee;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.22)); }
  .val .namn { font-size:26px; font-weight:400; letter-spacing:-.3px; }
  /* Spela är förvalet i praktiken — men bara visuellt. Hubben gissar inte.
     Skillnaden är en aning mer ljus i glaset, inte en egen färg. */
  .val.primar {
    background:linear-gradient(160deg, rgba(255,255,255,.26), rgba(255,255,255,.12)); }

  /* Pågående runda: kortsluter hubben (§2.1 beslut 4). Ligger överst och är
     det enda som får se brådskande ut — därför enda ytan med fylld accent. */
  .pagaende { display:block; text-decoration:none; background:var(--accent);
    color:var(--accent-ink); border-radius:22px; padding:18px 22px;
    margin-bottom:18px; box-shadow:0 10px 24px rgba(0,0,0,.20); }
  .pagaende .namn { font-size:19px; font-weight:800; }
  .pagaende .txt { font-size:13px; font-weight:600; opacity:.85; margin-top:4px; }

  /* Inbjudan till en boll. Ligger överst men är MEDVETET inte fylld accent —
     den ytan äger "fortsätt rundan" ensam (se kommentaren ovan). En inbjudan
     är angelägen, inte pågående: konturen bär accenten, inte ytan. */
  .inbjudan { border:1px solid var(--accent); border-radius:22px;
    background:rgba(255,255,255,.10); padding:16px 18px; margin-bottom:14px; }
  .inbjudan .vem { font-size:17px; font-weight:800; }
  .inbjudan .vad { font-size:14px; margin-top:4px; color:#cfe6d8; }
  .inbjudan .knappar { display:flex; gap:10px; margin-top:14px; }
  .inbjudan button { flex:1; font-family:inherit; font-size:15px; font-weight:700;
    padding:12px 10px; border-radius:12px; border:0; }
  .inbjudan .ja { background:var(--accent); color:var(--accent-ink); }
  .inbjudan .nej { background:rgba(255,255,255,.14); color:#eaf6ee; }
  .inbjudan .fel { color:#ffbdb3; font-size:13px; margin-top:10px; }

  /* Vägen till grinden under en pågående runda. Dämpad med flit — den är en
     utväg, inte ett erbjudande. */
  .redigera { display:block; text-align:center; text-decoration:none;
    color:#a9c9b6; font-size:14px; padding:2px 0 16px; margin-top:-12px; }

  /* Foten: golfaren ur loggan i en ring, som konceptbilden. Ringen är öppen
     (streckad krans med ett hopp) — dekor, ingen mätare. */
  /* Ringen krymper när kortet för pågående runda är framme — annars trycks
     foten under vikningen på en liten telefon. */
  .fot { margin-top:auto; padding-top:28px; text-align:center; }
  .fot a { color:#eaf6ee; text-decoration:none; font-size:15px;
    display:inline-block; padding:8px 16px 10px; }
  .fot .ring { display:block; position:relative; width:118px; height:118px;
    margin:0 auto 8px; transition:transform .12s ease; }
  #pagaende:not(:empty) ~ .fot .ring { width:102px; height:102px; }
  .fot .ring svg { position:absolute; inset:0; width:100%; height:100%; }
  /* Figuren centreras på ringens mittpunkt (left/top 50 % + translate), inte
     med margin:auto — bilden är smalare än hög, och auto-marginalerna gav en
     centrering som SÅG snedställd ut mot den runda kransen. */
  /* Nudgad ett par pixlar åt vänster: figurens tyngdpunkt ligger till höger om
     bildens mitt (klubban sticker ut åt vänster men väger nästan inget), så en
     exakt centrering ser högerförskjuten ut i den runda kransen. */
  .fot .ring img { position:absolute; left:50%; top:50%;
    transform:translate(calc(-50% - 5px), -50%); width:auto; height:60%; }
  .fot #ringbage { transition:stroke-dasharray .5s ease; }
  .fot a:active .ring { transform:scale(.97); }
  .fot .etikett { display:block; }
  .fot .status { display:block; margin-top:3px; font-size:13px; color:#a9c9b6; }
</style>
</head>

<div id="app">
  <h1>Birdiebook</h1>
  <p class="sub">Strokes gained-analys på riktigt</p>

  <!-- Inbjudningar ligger ÖVER "fortsätt rundan": en inbjudan är färskvara

  <div id="inbjudningar"></div>

  <div id="pagaende"></div>

  <!-- Spela leder till GRINDEN (uppsattning.html), inte rakt in i

  <a class="val primar" href="./uppsattning.html">

      <!-- Flaggan som i referensen: vimpel med svaj (inte en rak triangel),

      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true">

  <div class="fot">
    <a href="./profil.html">
      <!-- Golfaren är SAMMA figur som i loggan — `mobile/golfare.png` klipps ur

           SVG-golfare provades först och blev en annan figur än appikonens;

      <span class="ring">
        <!-- Ringen är en MÄTARE: hur långt den är fylld = hur stor del av
             profilen som är besvarad (Spelprofil.ifylldhet). Den startar rakt
             uppåt och går medsols, som en laddningsindikator. -->
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.16)"
                  stroke-width="4.5"/>
          <circle id="ringbage" cx="50" cy="50" r="45" fill="none" stroke="#a9dcb8"

<!-- Hubben bär ingen navigation — den ÄR navigationen. Platshållaren finns

<!-- Inbjudningar på hubben (sql/inbjudan.sql). supabase-js och live.js ligger
     redan i shell-cachen, så de kostar ingen nätrunda här; saknas de ändå
     ritas inga kort och resten av hubben är opåverkad. -->
<script src="./vendor/supabase-js.js"></script>
<script src="./live.js"></script>

<script>
"use strict";
/* Hubben — appens rot (APPSTORE_PLAN §2.1, §2.8.0/§2.8.3).
 *
 * Tre val, ett per syfte (§2.0). Avsiktligt TUNN: frestelsen att lägga väder,
 * senaste rundor och statuskort här ska stå emot — det kostar ett ögonkast
 * varje gång man ska ut och spela, och innehållet hör hemma inuti sitt läge.
 *
 * VARFÖR ROTEN OCH INTE EN NY FIL (§2.8.0): manifestets start_url är "./" och
 * service-workerns offline-fallback pekar på index.html. Ligger hubben i roten
 * behöver manifestet inte röras — och en ändrad start_url hade ändå inte slagit
 * igenom på redan installerade appar. Fallbacken blir dessutom BÄTTRE av bytet:
 * förut landade en offline-navigering som missade cachen på slagloggningen, en
 * vy som förutsätter en aktiv runda. Nu landar den här, och här fungerar allt
 * utan nät och utan runda.
 *
 * Slagloggningen (setup + hål + summering) bor i spela.html — samma fil som
 * förut, bara omdöpt. */
function esc(s) { return String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* Pågående runda kortsluter hubben (§1 beslut 1, §2.1 beslut 4): "öppnar man
   appen med en pågående runda går man rakt in i den".
 *
 * MEN bara vid KALL START. Ett ovillkorligt hopp hade gjort hubben oåtkomlig så
 * länge en runda är igång — och en runda kan ligga öppen i dagar, medan man
 * mycket väl kan vilja till Planera eller Analys under tiden. Trycker man
 * ⌂ Start inifrån appen ska man alltså KOMMA till hubben.
 *
 * "Kall start" = första gången hubben öppnas i den här flikens session. Flaggan
 * bor i sessionStorage: den nollställs när appen stängs, vilket är precis den
 * gräns beslutet handlar om. Kortet nedan ritas ändå, för när man väl står på
 * hubben ska vägen tillbaka in i rundan vara ett tryck bort. */
const KALLSTART_KLAR = "sg_hub_besokt";
function kortslutTillRundan() {
  if (!Store.active()) return false;
  let redanBesokt = true;
  try {
    redanBesokt = sessionStorage.getItem(KALLSTART_KLAR) === "1";
    sessionStorage.setItem(KALLSTART_KLAR, "1");
  } catch (_) { return false; }   // utan sessionStorage: hoppa aldrig
  if (redanBesokt) return false;
  location.replace("./spela.html");   // replace → ⌂ Start blir inte en fälla i historiken
  return true;
}
function ritaPagaende() {
  if (kortslutTillRundan()) return;
  const el = document.getElementById("pagaende");
  const doc = Store.active();
  if (!doc) { el.innerHTML = ""; return; }
  const bana = doc.courseName || "";
  const hal = doc.current || 1;
  /* "Redigera spel" är den ENDA vägen tillbaka till uppsättningen under en
     runda, och den är medvetet lite trög: ⌂ Start först, sedan hit. Mitt i en
     runda ska man inte snubbla in i banvalet — men när någon ansluter på hål
     sju ska det gå på två tryck. Länken ligger utanför det gröna kortet så den
     inte konkurrerar med "fortsätt": det är fortfarande rundan man vill in i
     nio gånger av tio. */
  el.innerHTML = `<a class="pagaende" href="./spela.html">
    <div class="namn">▶ Fortsätt rundan</div>
    <div class="txt">${esc(bana)}${bana ? " · " : ""}hål ${hal}</div>
  </a>
  <a class="redigera" href="./uppsattning.html">Redigera spel — lägg till spelare, byt tee</a>`;
}
/* Profil-ringen som mätare: hur långt kransen är fylld = hur stor del av
   profilen som är besvarad. Definitionen av "besvarad" ligger i Spelprofil
   (ifylldhet) — hubben ritar bara, så en ny fråga i guiden slår igenom här av
   sig själv.

   Full ring får INGEN sifferrad under: när allt är ifyllt finns inget att
   påminna om, och en evig "9 av 9" hade bara varit brus på en yta vars hela
   poäng är att vara tunn. */
const OMKRETS = 2 * Math.PI * 45;      // r=45 i ringens viewBox
function ritaProfilring() {
  const bage = document.getElementById("ringbage");
  const status = document.getElementById("profilstatus");
  if (!bage || typeof Spelprofil === "undefined") return;
  const f = Spelprofil.ifylldhet(Store.profile());
  bage.setAttribute("stroke-dasharray", `${(f.andel * OMKRETS).toFixed(1)} ${OMKRETS.toFixed(1)}`);
  status.textContent = f.andel >= 1 ? "" : `${f.klara} av ${f.totalt} ifyllt`;
  const lank = bage.closest("a");
  if (lank) lank.setAttribute("aria-label",
    `Profil och inställningar — ${f.klara} av ${f.totalt} ifyllt`);
}
/* ---------- inbjudningar (inbjudan.js) ----------
   MOTTAGARENS HALVA av "bjud in på namn". Värden söker upp dig i katalogen och
   trycker bjud in; det här är kortet som gör att du får veta det utan att någon
   läser upp en spelkod.

   Kortet ritas ALLTID vid sidvisning och dessutom på realtidshändelser —
   prenumerationen är en förbättring, aldrig den enda vägen (samma hållning som
   subscribePins i live.js). Utan nät finns inga inbjudningar att visa, och då
   är ytan tom i stället för trasig. */
let inbjudanFel = "";
async function ritaInbjudningar() {
  const el = document.getElementById("inbjudningar");
  if (!el) return;
  if (typeof Inbjudan === "undefined" || !Inbjudan.tillganglig()) { el.innerHTML = ""; return; }
  let rader = [];
  try { rader = await Inbjudan.mina(); } catch (_) { return; }
  if (!rader.length) { el.innerHTML = ""; return; }
  const tid = iso => {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d)) return null;
    const p = n => String(n).padStart(2, "0");
    const idag = new Date().toDateString() === d.toDateString();
    return p(d.getHours()) + ":" + p(d.getMinutes()) + (idag ? "" : " imorgon");
  };
  el.innerHTML = rader.map(r => {
    // Bana och tee-tid är hela skillnaden mot en naken spelkod: utan dem är en
    // inbjudan bara fyra tecken man ska lita på.
    const delar = [r.bana, tid(r.tee_time)].filter(Boolean).join(" · ");
    return `<div class="inbjudan" data-inb="${esc(r.id)}">
      <div class="vem">${esc(r.fran_namn)} bjöd in dig att spela</div>
      <div class="vad">${esc(delar || "Ingen bana angiven ännu")}</div>
      <div class="knappar">
        <button class="ja" data-ja="${esc(r.id)}">Gå med</button>
        <button class="nej" data-nej="${esc(r.id)}">Avböj</button>
      </div>
      ${inbjudanFel ? `<div class="fel">${esc(inbjudanFel)}</div>` : ""}
    </div>`;
  }).join("");

  const arbeta = async (btn, id, ja) => {
    btn.disabled = true;
    btn.textContent = ja ? "Går med …" : "Avböjer …";
    inbjudanFel = "";
    const r = await Inbjudan.svara(id, ja);
    if (!r.ok) {
      inbjudanFel = r.fel || "Något gick fel. Prova igen.";
      return ritaInbjudningar();
    }
    if (!ja) return ritaInbjudningar();
    /* Matchen läggs in LOKALT här, inte först när spela.html öppnas: gör man
       inte det landar man på uppsättningen utan att vara med i något, och den
       enda ledtråden vore att kortet försvunnit. */
    const nuvarande = Store.match();
    if (nuvarande && nuvarande.gameId && nuvarande.gameId !== r.gameId &&
        !confirm("Du är redan med i en annan match. Byta till den nya?")) {
      return ritaInbjudningar();
    }
    await Store.setMatch(Object.assign({}, nuvarande || {},
      { gameId: r.gameId, code: r.kod, teeTime: r.teeTime || null,
        displayName: (Store.profile() || {}).namn || "" }));
    location.href = "./spela.html";
  };
  el.querySelectorAll("[data-ja]").forEach(b => {
    b.onclick = () => arbeta(b, b.dataset.ja, true);
  });
  el.querySelectorAll("[data-nej]").forEach(b => {
    b.onclick = () => arbeta(b, b.dataset.nej, false);
  });
}

function rita() { ritaPagaende(); ritaProfilring(); ritaInbjudningar(); }
Store.ready().then(rita);
window.addEventListener("pageshow", () => Store.ready().then(rita));
/* Realtid: kortet ska kunna dyka upp medan telefonen ligger på bordet. */
if (typeof Inbjudan !== "undefined" && Inbjudan.tillganglig()) {
  Inbjudan.prenumerera(() => { ritaInbjudningar().catch(() => {}); });
}
</script>
<script>
/* Håll navigeringen inne i hemskärms-appen (iOS standalone): utan detta öppnar
   iOS länkar till andra sidor i en Safari-ruta. */
(function () {
  var standalone = ("standalone" in navigator && navigator.standalone)
    || matchMedia("(display-mode: standalone)").matches;
  if (!standalone) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var url = new URL(a.getAttribute("href"), location.href);
    if (url.origin !== location.origin) return;
    e.preventDefault();
    location.href = url.href;
  });
})();
</script>
