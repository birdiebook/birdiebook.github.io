     scripts (inte moduler) FÖRE modulen nedan — samma mönster som

     funktioner som aldrig anropas här, så den går att ladda utan Leaflet. -->
<script src="./coursemap.js"></script>  <!-- MAP_FILTER: 2D-kartans ortofoto-look, som 3D-marken matchar -->
<script src="./bildfilter.js"></script> <!-- efter coursemap.js: räknar korrigeringen ur dess filter -->
<script src="./mapcore.js"></script>

<script src="./sol.js"></script>       <!-- U7: solens position -->
<script src="./playas.js"></script>

<title>SG Hål i 3D</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none; }
  /* U18: `touch-action:none` hor hemma HAR, pa canvasen, och inte pa body.
     Egenskapen arvs, sa pa body traffade den varje <input type=range> pa
     sidan - och med touch-action:none driver webblasaren inte langre
     reglagets tumme. Reglagen svarade darfor pa tryck men inte pa drag
     ("svara att fa tag i", faltrapport 2026-08-01). Kameragesterna behover
     regeln, panelerna far inte ha den. */
  #scen { position:fixed; inset:0; touch-action:none; }
  #topp { position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; gap:8px; align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    background:linear-gradient(var(--panel), transparent); }
  #topp a.back { color:var(--ink); text-decoration:none; font-size:20px;
    padding:4px 10px 4px 4px; }
  #topp select { flex:1; min-width:0; background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    font-size:15px; font-weight:600; }
  #fakta { font-size:13px; color:var(--dim); white-space:nowrap; }
  #botten { position:fixed; left:0; right:0; z-index:5;
    bottom:0; padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(transparent, var(--panel));
    display:flex; align-items:center; gap:10px; }
  #botten label { font-size:13px; color:var(--dim); white-space:nowrap; }
  #exag { flex:1; accent-color:var(--accent-ui); }
  #status { position:fixed; inset:0; display:flex; align-items:center;
    justify-content:center; z-index:4; color:var(--dim); font-size:15px;
    text-align:center; padding:0 30px; pointer-events:none; }
  #kalla { position:fixed; right:8px; z-index:5; font-size:9px; color:var(--dim-svagare);
    bottom:calc(env(safe-area-inset-bottom) + 58px); }
  /* U4 verktygsrad. UPPE till hoger sedan 2026-07-31 (beslut: bottenhogern ar
     kvar at overdriften och avbryt-knappen). Ligger UNDER halremsan, sa varken
     notch eller select kan hamna over den - samma 54px-dockning som
     hojdpanelen, och darfor maste panelen sluta 82px fran hoger kant
     (knappbredd 64 + 10 marginal + 8 luft). Se #hojdpanel. */
  #verktyg { position:fixed; right:10px; z-index:6;
    top:calc(env(safe-area-inset-top) + 54px);
    display:flex; flex-direction:column; gap:8px; }
  #verktyg button { width:64px; padding:7px 4px 6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:var(--panel); color:var(--ink); border:1px solid var(--panelkant);
    border-radius:14px; backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    -webkit-backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    box-shadow:0 10px 32px var(--skuggfarg); font:600 9px/1 inherit;
    letter-spacing:.06em; text-transform:uppercase;
    transition:background .15s ease, border-color .15s ease, transform .12s ease; }
  #verktyg button:active:not(:disabled) { transform:scale(.97); }
  #verktyg button[aria-pressed="true"] { border-color:var(--accent-ui-kant); color:var(--accent-ui-ljus); }
  #verktyg button:disabled { opacity:.38; cursor:default; }
  #verktyg svg { width:19px; height:19px; fill:none; stroke:currentColor;
    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  /* U9: vilken runda slagen kommer ur. Ligger i verktygsraden (flex column) sa
     den inte behover en egen fixerad position som kan glida ifran raden. */
  #slaginfo { width:64px; font:600 8.5px/1.25 inherit; color:var(--dim);
    text-align:center; letter-spacing:.02em; }
  @media (prefers-reduced-motion: reduce) {
    #verktyg button { transition:none; } }
  /* U6 höjdprofil-panel. Dockad under #topp — bottenzonen är upptagen av
     överdrifts-reglaget (UPPGRADERING_3D §5 U6). Slutar 82px från höger kant
     eftersom verktygsraden sedan 2026-07-31 står i samma zon; går den ända ut
     ligger panelen ovanpå knapparna. Profilens SVG har
     preserveAspectRatio="none" och skalar därför utan att beskäras. */
  #hojdpanel { position:fixed; left:10px; right:82px; z-index:5;
    top:calc(env(safe-area-inset-top) + 54px);
    background:var(--panel); border:1px solid var(--panelkant); border-radius:14px;
    padding:10px 12px 8px; backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    -webkit-backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    box-shadow:0 10px 32px var(--skuggfarg); }
  #hojdpanel.dold { display:none; }
  /* U16 vindpanel. Bottenzonen ar fri sedan verktygsraden flyttade upp; den
     ligger ovanfor overdrifts-reglaget och lamnar mitten at banan (§3.4). */
  #vindpanel { position:fixed; left:10px; right:10px; z-index:5;
    bottom:calc(env(safe-area-inset-bottom) + 56px);
    background:var(--panel); border:1px solid var(--panelkant); border-radius:14px;
    padding:9px 12px 10px; backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    -webkit-backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    box-shadow:0 10px 32px var(--skuggfarg); }
  #vindpanel.dold { display:none; }
  #vindrad { display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--dim); gap:8px; margin-bottom:6px; }
  #vindrad b { color:var(--ink); font-size:15px; font-weight:700; }
  #vindalder { font-size:11px; color:var(--dim); }
  #vindpanel .reg { display:grid; grid-template-columns:52px 1fr 46px;
    align-items:center; gap:8px; font-size:12px; color:var(--dim); margin-top:3px; }
  #vindpanel input[type=range] { width:100%; accent-color:var(--accent-ui); }
  #vindpanel .varde { text-align:right; color:var(--ink); font-weight:600; }
  #vindater { margin-top:7px; background:none; border:1px solid var(--panelkant);
    color:var(--dim); border-radius:9px; padding:4px 9px; font:600 11px inherit; }
  /* U16 steg 4: siktraden. Samma bla som siktlinjen i scenen - texten och
     strecket ska laesas som samma svar, inte som tva upplysningar. */
  .siktrad { margin-top:7px; padding-top:6px; border-top:1px solid var(--panelkant-svag);
    font-size:12px; color:var(--dim); line-height:1.45; }
  .siktrad:empty { display:none; }
  .siktrad b { color:var(--info); font-weight:700; }
  /* U17 slagpanelen. Samma bottendockning och samma reglage-grid som
     vindpanelen — de två visas aldrig samtidigt (setLage stanger vinden nar
     slaget oppnas), sa de far dela plats. */
  #slagpanel { position:fixed; left:10px; right:10px; z-index:5;
    bottom:calc(env(safe-area-inset-bottom) + 56px);
    max-height:62vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--panelkant); border-radius:14px;
    padding:9px 12px 10px; backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    -webkit-backdrop-filter:blur(12px) saturate(.88) brightness(.94);
    box-shadow:0 10px 32px var(--skuggfarg); }
  #slagpanel.dold { display:none; }
  #slagrubrik { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  #slagrubrik b { font-size:15px; }
  #slagandrad { font:700 9px/1 inherit; letter-spacing:.08em; text-transform:uppercase;
    color:var(--varning); border:1px solid var(--varning-svag); border-radius:6px; padding:3px 5px; }
  #slagandrad[hidden] { display:none; }
  #slagstang { margin-left:auto; background:none; border:none; color:var(--dim);
    font-size:19px; line-height:1; padding:0 3px; cursor:pointer; }
  #slagtal { font-size:12px; color:var(--dim); line-height:1.5; margin-bottom:5px; }
  #slagtal b { color:var(--ink); font-weight:600; }
  #slagpanel .reg { display:grid; grid-template-columns:60px 1fr 52px;
    align-items:center; gap:8px; font-size:12px; color:var(--dim); margin-top:3px; }
  #slagpanel input[type=range] { width:100%; accent-color:var(--accent-ui); }
  #slagpanel .varde { text-align:right; color:var(--ink); font-weight:600; }
  #slagpanel .rubrad { font:700 9px/1 inherit; letter-spacing:.08em; margin-top:8px;
    text-transform:uppercase; color:var(--dim-svag); }
  #slagpanel .knappar { display:flex; gap:8px; margin-top:8px; }
  #slagpanel .knappar button { background:none; border:1px solid var(--panelkant);
    color:var(--dim); border-radius:9px; padding:4px 9px; font:600 11px inherit; }
  #slaghjalp { font-size:10.5px; color:var(--dim-svag); margin-top:7px; line-height:1.45; }
  #hojdrad { display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--dim); margin-bottom:4px; gap:8px; }
  #hojdrad b { color:var(--ink); font-size:15px; font-weight:700; }
  #hojdsvg { width:100%; height:74px; display:block; touch-action:none; }
  #hojdlive { font-size:12.5px; color:var(--dim); margin-top:4px; }
  #hojdlive b { color:var(--accent-ui); font-weight:700; }
</style>
</head>
<body>
<div id="scen"></div>
<div id="topp">
  <a class="back" id="back" href="index.html" aria-label="tillbaka">‹</a>
  <select id="hal"></select>
  <span id="fakta"></span>
</div>
<script>
  /* Öppnad från plan-läget (?from=plan) → tillbaka-knappen går till hubben. */
  if (new URLSearchParams(location.search).get("from") === "plan") {
    const back = document.getElementById("back");
    back.setAttribute("href", "planera.html");
    back.textContent = "‹ Tillbaka till plan";
    back.style.fontSize = "15px";
    back.style.fontWeight = "600";
  }
</script>
<div id="status">laddar…</div>
<div id="kalla">Foto & höjddata © Lantmäteriet (CC BY 4.0)</div>
<div id="hojdpanel" class="dold">
  <div id="hojdrad"><b id="hojdDelta"></b><span id="hojdLangd"></span></div>
  <svg id="hojdsvg" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
  <div id="hojdlive"></div>
</div>
<div id="botten">
  <label>överdrift <span id="exagv">3×</span></label>
  <input id="exag" type="range" min="1" max="5" step="0.5" value="3">
</div>
<div id="verktyg" role="group" aria-label="Verktyg">
  <button id="vFlyover" type="button" title="Svep langs hallinjen"><svg viewBox="0 0 24 24"><path d="M3 19h18"/><path d="M5 15l5-8 4 6 2-3 3 5"/></svg><span>Flyover</span></button>
  <button id="vTeevy" type="button" title="Vyn fran teen, blicken mot green"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M12 3l7 2.5L12 8"/><ellipse cx="12" cy="18" rx="6" ry="2.2"/></svg><span>Tee-vy</span></button>
  <button id="vHojd" type="button" title="Hojdprofil och spelar som"><svg viewBox="0 0 24 24"><path d="M3 18h18"/><path d="M3 14l6-7 5 5 3-3 4 5"/></svg><span>Hojd</span></button>
  <button id="vSlaget" type="button" disabled title="Valj ett slag och andra apex, vind och spridning"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg><span>Slaget</span></button>
  <button id="vSlag" type="button" disabled title="Dina loggade slag pa halet"><svg viewBox="0 0 24 24"><path d="M4 19c4-1 6-6 8-9s4-5 8-6"/><circle cx="4" cy="19" r="1.8"/><circle cx="12" cy="10" r="1.8"/><circle cx="20" cy="4" r="1.8"/></svg><span>Slag</span></button>
  <button id="vVind" type="button" title="Vindens verkan pa bollbanan"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 13h15a3 3 0 1 1-3 3"/><path d="M3 18h8"/></svg><span>Vind</span></button>
  <div id="slaginfo" hidden></div>
</div>
<div id="vindpanel" class="dold">
  <div id="vindrad"><b id="vindNu">–</b><span id="vindalder"></span></div>
  <div class="reg"><label for="vMs">medel</label>
    <input id="vMs" type="range" min="0" max="20" step="0.5" value="0">
    <span class="varde" id="vMsV">0 m/s</span></div>
  <div class="reg"><label for="vGust">by</label>
    <input id="vGust" type="range" min="0" max="30" step="0.5" value="0">
    <span class="varde" id="vGustV">0 m/s</span></div>
  <div class="reg"><label for="vDir">från</label>
    <input id="vDir" type="range" min="0" max="350" step="10" value="0">
    <span class="varde" id="vDirV">N</span></div>
  <button id="vindater" type="button">Återställ till hämtad vind</button>
  <div class="siktrad"></div>
</div>
<div id="slagpanel" class="dold">
  <div id="slagrubrik"><b id="slagnr">Slaget</b><span id="slagandrad" hidden>ändrad</span>
    <button id="slagstang" type="button" aria-label="stäng">×</button></div>
  <div id="slagtal"></div>
  <div class="reg"><label for="sApex">apex</label>
    <input id="sApex" type="range" min="0.4" max="2" step="0.05" value="1">
    <span class="varde" id="sApexV">×1,00</span></div>
  <div class="rubrad">Vind för det här slaget</div>
  <div class="reg"><label for="sMs">medel</label>
    <input id="sMs" type="range" min="0" max="20" step="0.5" value="0">
    <span class="varde" id="sMsV">0 m/s</span></div>
  <div class="reg"><label for="sGust">by</label>
    <input id="sGust" type="range" min="0" max="30" step="0.5" value="0">
    <span class="varde" id="sGustV">0 m/s</span></div>
  <div class="reg"><label for="sDir">från</label>
    <input id="sDir" type="range" min="0" max="350" step="10" value="0">
    <span class="varde" id="sDirV">N</span></div>
  <div class="rubrad">Antagen spridning (0 = av)</div>
  <div class="reg"><label for="sSprC">i sidled</label>
    <input id="sSprC" type="range" min="0" max="40" step="1" value="0">
    <span class="varde" id="sSprCV">av</span></div>
  <div class="reg"><label for="sSprA">i längd</label>
    <input id="sSprA" type="range" min="0" max="40" step="1" value="0">
    <span class="varde" id="sSprAV">av</span></div>
  <div class="knappar">
    <button id="sAter" type="button">Återställ slaget</button>
    <button id="sAterAlla" type="button">Återställ alla</button>
  </div>
  <div class="siktrad"></div>
  <div id="slaghjalp">Justeringarna ändrar bara vyn — rundan är loggad data och rörs
    aldrig. Spridningen kommer <span id="sprkalla">ur din spelprofil</span>.</div>
</div>
<button id="flyavbryt" style="display:none; position:fixed; z-index:6;
  left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 66px);
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:20px; padding:8px 16px; font-size:14px;">⏸ Avbryt flygning</button>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<!-- U11: motorn bor i hal3d.js och delas med planeringsvyn (planvy.html).
     Importmappen ovan ligger kvar HÄR — den gäller dokumentet, inte modulen,
     och utan den kan `import … from 'three'` inte slås upp. -->
<script type="module" src="./hal3d.js"></script>
</body>
</html>
