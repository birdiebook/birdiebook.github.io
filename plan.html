<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 12px 14px 40px; }
  .top { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .top a.back { color: var(--ink); text-decoration: none; font-size: 22px;
    padding: 4px 10px 4px 2px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--dim); font-size: 14px; margin: 0 0 14px; line-height: 1.45; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 13px 14px; margin: 10px 0; }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.5; }
  .banner { background: var(--amber-yta); border: 1px solid var(--amber-kant);
    color: var(--amber-ink); border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
    margin: 10px 0; line-height: 1.45; }

  .knappar { display: flex; gap: 10px; margin: 12px 0 4px; }
  .btn { flex: 1; appearance: none; border: 0; border-radius: 12px; min-height: 48px;
    background: var(--accent); color: var(--accent-ink); font: 800 15px inherit; cursor: pointer; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--dim);
    font-weight: 600; }
  .btn[disabled] { opacity: .55; }

  /* HÅLKORTET. Målscore är det enda talet som får vara stort: det är svaret på
     frågan spelaren ställde. Allt annat är hur man kommer dit. */
  .hal { padding: 0; overflow: hidden; }
  .halhuv { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--panel-svag); border-bottom: 1px solid var(--line); }
  .halhuv .tx { flex: 1; min-width: 0; }
  .halhuv .rub { font-size: 16px; font-weight: 800; }
  .halhuv .fak { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .mal { flex: none; text-align: center; min-width: 46px; }
  .mal b { display: block; font-size: 26px; line-height: 1; font-weight: 800; }
  .mal span { display: block; color: var(--dim); font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; margin-top: 3px; }
  .mal.egen b { color: var(--accent); }
  .halkropp { padding: 11px 14px 13px; }

  .slag { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .slag:last-of-type { border-bottom: 0; }
  .slag .nr { flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel-svag); border: 1px solid var(--line); color: var(--dim);
    font-size: 12px; font-weight: 700; display: flex; align-items: center;
    justify-content: center; margin-top: 1px; }
  .slag .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; }
  .slag .tx .et { color: var(--dim); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .04em; }
  .slag .tx .egen { color: var(--accent); }
  .slag a.sikt { flex: none; align-self: flex-start; text-decoration: none;
    color: var(--ink); background: var(--panel-svag); border: 1px solid var(--line);
    border-radius: 9px; font-size: 12px; font-weight: 700; padding: 7px 9px;
    min-height: 32px; display: flex; align-items: center; }

  .rad-info { font-size: 13px; line-height: 1.5; margin: 8px 0 0; }
  .rad-info.risk { color: var(--amber-ink); }
  .anteckning { margin-top: 9px; padding: 9px 11px; border-radius: 10px;
    background: var(--panel-svag); border: 1px solid var(--line);
    font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }

  .verktyg { display: flex; gap: 8px; margin-top: 10px; }
  .verktyg button { appearance: none; background: none; border: 1px solid var(--line);
    color: var(--dim); border-radius: 10px; min-height: 38px; padding: 0 12px;
    font: 600 13px inherit; cursor: pointer; }

  label.f { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  input.f, textarea.f { width: 100%; background: var(--panel-svag); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
    font: 400 15px inherit; min-height: 44px; }
  textarea.f { min-height: 72px; resize: vertical; }

  /* SP5: beslutsförst. Avsnittsrubrikerna delar planen i två läsningar —
     de få hålen där banan ställer en fråga, och resten. */
  .avsnitt { margin: 18px 2px 4px; color: var(--dim); font-size: 12px;
    text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .card.hal.beslut { border-color: var(--accent-ui-kant); }
  .card.hal.beslut .halhuv { background: var(--accent-ui-tval); }
  .rad-info.val { color: var(--accent-ui-ljus); font-weight: 600; }
  .verktyg a.knapplank { display: flex; align-items: center; text-decoration: none;
    border: 1px solid var(--line); color: var(--dim); border-radius: 10px;
    min-height: 38px; padding: 0 12px; font: 600 13px inherit; }

  /* Den kompakta hålraden. Hela raden är knappen: på en teebox trycker man med
     tummen, inte på en 12 px stor pil. */
  .halrad { display: flex; width: 100%; gap: 10px; align-items: center;
    text-align: left; appearance: none; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font: inherit; padding: 9px 12px; margin: 6px 0; min-height: 48px; }
  .halrad .h { flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel-svag); border: 1px solid var(--line); color: var(--dim);
    font-size: 12.5px; font-weight: 800; display: flex; align-items: center;
    justify-content: center; }
  .halrad .p { flex: 1; min-width: 0; font-size: 13px; }
  .halrad .p b { display: block; font-size: 12.5px; color: var(--dim); font-weight: 600; }
  .halrad .p .s { display: block; margin-top: 1px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .halrad .p .egenmark { color: var(--accent); font-size: 11.5px; }
  .halrad .m { flex: none; font-weight: 800; font-size: 17px; }

  .lista { display: flex; flex-direction: column; gap: 2px; }
  .yard { display: flex; gap: 10px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px solid var(--line); }
  .yard:last-child { border-bottom: 0; }
  .yard .h { flex: none; width: 52px; color: var(--dim); }
  .yard .p { flex: 1; }
  .yard .m { flex: none; font-weight: 700; }
</style>
</head>
<body>
<div id="app"><p class="hint" style="padding:20px 14px">Laddar …</p></div>

<script src="./round.js"></script>
<script src="./score.js"></script>
<script src="./spelprofil.js"></script>
<script src="./plan.js"></script>
<script src="./store.js"></script>
<!-- SP5: planen räknas HÄR, inte på PC:n. Kedjan är densamma som hålvyns —
     sg.js bär baslinjen, strategi.js är motorn, forslag.js vet vad som får
     skrivas, planrunda.js sätter ihop dokumentet. mapcore.js rör Leaflets `L`
     bara inne i kartfunktioner, så den går att ladda utan Leaflet (samma
     upplägg som hal3d.html). Ordningen är ett beroende, inte en smak. -->
<script src="./coursemap.js"></script>
<script src="./assetbas.js"></script>
<script src="./mapcore.js"></script>
<script src="./playas.js"></script>
<script src="./kompass.js"></script>
<script src="./vylage.js"></script>
<script src="./sg.js"></script>
<script src="./strategi.js"></script>
<script src="./forslag.js"></script>
<script src="./planrunda.js"></script>
<script>
"use strict";
/* MIN PLAN — den läsbara rundplanen (UPPGRADERING_3D §GP3, SPELPLAN_PLAN §SP5).
 *
 * SP5 KLIPPTE DEN SISTA TRÅDEN TILL PC:N. Fram till dess räknades planen av
 * `planner.py` bakom `/api/plan/kort`, alltså krävde ett dokument som ska läsas
 * på teen en analys-server, en token och nät. Nu räknas den här: `strategi.js`
 * mot den skeppade värdeytan, `forslag.js` för vad som får skrivas och
 * `planrunda.js` som sätter ihop hålkorten. Formen är API:ts oförändrad, så
 * `plan.js` tar emot svaret med `franKort` precis som förut — och spelarens
 * `egen`-lager och matchningen på globalt hålnummer är därmed samma kod som
 * redan var bevisad.
 *
 * DOKUMENTET ÄR BESLUTSFÖRST. Tystnad är normaltillståndet (§5.2): på Burlöv
 * ställer ett hål av 21 en fråga. Rundans FÅ beslut ligger därför överst med
 * alternativet utskrivet, och resten är en kompakt lista man kan fälla ut. En
 * plan som ger alla 18 hål lika mycket plats påstår att alla 18 är lika
 * viktiga.
 *
 * TVÅ SAKER SIDAN ÄGER, OCH BARA DE:
 *   1. Ihopsamlingen. Bandata, baslinje, värdeyta, dagens vind och hålens
 *      höjdprofiler hämtas här och matas till motorn. Sidan räknar ingenting
 *      själv — §GP3:s "ingen siffra utan motsvarighet" upprätthålls av att den
 *      saknar aritmetik att bryta den med.
 *   2. Redigeringen. Spelarens text går till `Plan.satt*`, aldrig direkt in i
 *      dokumentet, så motorns svar står orört kvar under.
 *
 * Att räkna kräver värdeytan (ligger i appen) och gärna nät för VINDEN. Utan
 * nät blir planen vindstilla och SÄGER det på varje hål, i stället för att låta
 * ett vindfritt tal se ut som dagens.
 */
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const komma = v => String(v).replace(".", ",");

let P = null;              // aktuellt plandokument (null = ingen plan än)
let redigerar = null;      // hålets rel-nummer som är öppet för redigering
const oppna = new Set();   // hål i den kompakta listan som spelaren fällt ut
let banmeta = {};          // globalt hål → {loop, hole, par, length_m}
let jobbar = false;

const spec = () => SGRound.roundName();
const kombination = () => {
  const p = Store.profile();
  return (p && typeof Spelprofil !== "undefined") ? Spelprofil.kombination(p) : null;
};

/* ---------- planen räknas här (SP5) ---------- */
const FOR = Forslag.skapa();
/* Dagens pinnar bor i `Vylage` — det är hålvyn som låter spelaren flytta dem
   (§SP4). Dokumentet LÄSER dem: en pin man flyttat i kartan ska ge samma
   inspel i planen, annars säger de två ytorna olika om samma hål. */
const VY = Vylage.skapa();
let ROUND = [];            // rundans hål i spelordning (bandatans poster)
let GLOBALS = [];          // motsvarande globala hålnummer
let framsteg = null;       // "Räknar hål 7 av 18 …" medan planen byggs

/* Bandatan behövs både för den tomma planen (par och längd) och för räkningen
   (polygonerna motorn rastrerar). Saknas den blir listan tom — en plan med
   påhittade par vore sämre än ingen. */
async function laddaBanmeta() {
  try {
    const course = await MapCore.loadCourse();
    for (const h of course.HOLES) banmeta[h.global] = h;
    const seq = SGRound.ROUND_SEQ[spec()] || SGRound.ROUND_SEQ["1-18"] || [];
    ROUND = []; GLOBALS = [];
    seq.forEach(g => {
      const h = course.byGlobal[g];
      if (h) { ROUND.push(h); GLOBALS.push(g); }
    });
  } catch (e) { /* offline utan cachad bandata — plan går då inte att göra */ }
}

/* Hålets längd FRÅN SPELARENS TEE. Bandatans `length_m` är scorekortets
   standardlängd — står kortet "Par 3 · 145 m" medan slagraden säger 183 m är
   båda talen sanna och läsaren osäker på båda (uppmätt på Blue 4: tee 61 ligger
   182 m från pin, scorekortslängden är 145). Tee-boxarna bär sin egen
   `dist_to_pin_m`, och det är den teen planen faktiskt är räknad från. */
function langdFor(h) {
  const p = MapCore.teePoint(h);
  const t = p && (h.tees || []).find(x => x.lat === p[0] && x.lon === p[1]);
  if (t && t.dist_to_pin_m != null) return t.dist_to_pin_m;
  return h.length_m != null ? h.length_m : null;
}

function halMetaForRunda() {
  return ROUND.map((h, i) => ({
    hole_global: GLOBALS[i], loop: h.loop, hole_number: h.hole, par: h.par,
    hole_dist: langdFor(h),
  }));
}

/* Hålets höjdprofil (holes3d-metan) som ett löfte. `PlayAs.loadElev3d` är
   eld-och-glöm med en callback — här behövs väntan, för höjdtermen ska vara MED
   i svepet (§SP4) och inte råka komma efter. Ett hål utan exporterad 3D
   resolverar med null, och då säger kortets förutsättningsrad "utan höjd". */
function laddaHojd(h) {
  const klart = PlayAs.meta(h);
  if (klart) return Promise.resolve(klart);
  return new Promise(res => {
    let svarat = false;
    const ge = () => { if (!svarat) { svarat = true; res(PlayAs.meta(h)); } };
    PlayAs.loadElev3d(h, ge);
    setTimeout(ge, 3000);      // saknas filen fyrar callbacken aldrig
  });
}

/* Vad motorn behöver för ETT hål. Samma uppsättning som hålvyn skickar
   (`planvy.html:forslagsIndata`) — samma tee, samma pin, samma höjduppslag —
   för planen och kartan ska svara samma sak om samma hål. */
function indataFor(h, vind, m) {
  return {
    loop: h.loop, hole: h.hole, bandataHal: h,
    tee: MapCore.teePoint(h),
    teeNamn: localStorage.getItem("sg_tee") || null,
    pin: VY.pin(SGRound.GLOBAL_BASE[h.loop] + h.hole),
    vind,
    baslinje: (lie, d) => SG.expectedStrokes(lie, d, baslinjeNamn),
    dh: m ? (a, b) => {
      const y0 = PlayAs.elev3dAt(m, a[0], a[1]), y1 = PlayAs.elev3dAt(m, b[0], b[1]);
      return (y0 == null || y1 == null) ? null : y1 - y0;
    } : null,
    dhGreen: m ? (a) => PlayAs.dh3dToGreen({ pt: a }, h) : null,
  };
}

let baslinjeNamn = null;

/* Värdeytan + baslinjen. Båda ligger i appen (SP1), så det här kräver inget
   nät — men det kräver en BESVARAD profil: ytan är namngiven efter
   profilkombinationen (GP1), och `hcpokand` är en fil som inte finns. */
async function laddaMotor() {
  if (!SG.loaded()) {
    SG.load(await (await fetch("./data/baseline.json", { cache: "force-cache" })).json());
  }
  await Store.ready();      // en tom profil svarar synkront men är inte svaret
  const komb = kombination();
  if (!komb) throw new Error("Profilen kunde inte läsas — fyll i den under Profil först.");
  // Samma kompromiss som hålvyn (§8.3): spelarens egen yta först, annars
  // närmaste skeppade — och `planrunda.js` skriver ut vilken, i varje korts
  // förutsättningsrad.
  await FOR.ladda({ slug: SGRound.activeSlug(), kombination: komb,
                    valj: Spelprofil.narmasteKombinationer });
  if (!FOR.laddad()) {
    throw new Error(Spelprofil.harPlanSvar(Store.profile())
      ? "Ingen plan är byggd för den här banan."
      : "Planen behöver din spelprofil — svara på frågorna under Profil.");
  }
  baslinjeNamn = FOR.ytan().profil.baseline;
  /* BÅDA kombinationerna följer med, och det är inte överflödigt.
     `drive/approach/baseline` är SPELARENS egen — det är den planen ska
     jämföras mot när appen frågar "gäller den fortfarande?" (`stammerMedProfil`).
     `raknad` är den yta svaret faktiskt kom ur, som kan vara en kompromiss
     (§SP3b). Blandas de ihop får man antingen en plan som påstår sig gälla en
     spelare den inte gäller, eller en varning om "annan profil" som aldrig går
     att bli av med — den senare mätt 2026-08-04. */
  const p = FOR.profilen();
  return { ...komb, raknad: p.kombination, egen: p.egen };
}

async function generera() {
  if (jobbar) return;
  jobbar = true; framsteg = "Förbereder …"; render();
  try {
    if (!ROUND.length) await laddaBanmeta();
    if (!ROUND.length) throw new Error("Bandata saknas i telefonen.");
    const komb = await laddaMotor();
    /* EN vind för hela rundan, hämtad en gång. Den är ett ögonblick och inte en
       prognos per hål — därför står den på varje kort, så ingen läser ett tal
       som om det gällde fyra timmar senare. Utan nät blir den null, och då
       säger korten "vindstilla". */
    framsteg = "Hämtar vinden …"; render();
    const mitt = (ROUND[0] && ROUND[0].green_center) || null;
    const vind = mitt ? await PlayAs.fetchWind(mitt[0], mitt[1]) : null;

    /* Höjdprofilerna hämtas ALLA PÅ EN GÅNG och inte hål för hål. Väntan är
       densamma när filerna finns (de ligger i sw-cachen efter första
       besöket) — men på en bana UTAN 3D-export fyrar callbacken aldrig, och
       sekventiellt hade planen då stått och väntat ut sin egen tidsgräns arton
       gånger i rad. */
    framsteg = "Läser höjdprofilerna …"; render();
    const metan = await Promise.all(ROUND.map(h => laddaHojd(h)));

    const hal = [];
    for (let i = 0; i < ROUND.length; i++) {
      const h = ROUND[i];
      framsteg = `Räknar hål ${i + 1} av ${ROUND.length} …`;
      if (i % 3 === 0) render();          // ge skärmen en chans mellan hålen
      const m = metan[i];
      let f = null;
      try { f = FOR.forHal(indataFor(h, vind, m)); } catch (e) { f = null; }
      hal.push({ f, meta: { rel: i + 1, hole_global: GLOBALS[i], loop: h.loop,
                            hole_number: h.hole, par: h.par,
                            hole_dist: langdFor(h),
                            tee_latlon: MapCore.teePoint(h),
                            pin_latlon: VY.pin(GLOBALS[i]) || h.green_center || null } });
    }
    const svar = Planrunda.bygg({
      spec: spec(), course: SGRound.activeSlug(), kombination: komb,
      planVersion: FOR.ytan().plan_version || null,
      stil: (Store.profile() || {}).stil || null,
      hal,
    });
    P = Store.savePlan(Plan.franKort(svar, {
      fore: P, courseName: SGRound.courseName ? SGRound.courseName() : null }));
  } catch (e) {
    alert("Kunde inte räkna planen: " + e.message +
          "\n\nEn redan sparad plan är orörd — du kan fortsätta läsa den.");
  }
  jobbar = false; framsteg = null; render();
}

function tomPlan() {
  const hal = halMetaForRunda();
  if (!hal.length) {
    alert("Bandata saknas i telefonen — en tom plan kan inte veta vilka hål rundan har.");
    return;
  }
  P = Store.savePlan(Plan.tom({
    spec: spec(), holes: hal, profil: kombination(),
  }));
  render();
}

/* ---------- rendering ---------- */
/* Förutsättningsraden står EN gång när den gäller hela rundan (samma tee, samma
   vind, samma sorts pin) och per hål annars. Att upprepa samma rad 18 gånger
   gör den till bakgrund, och en rad man slutar läsa kan lika gärna saknas. */
function delatVillkor() {
  const v = (P.holes || []).map(k => k.villkor).filter(Boolean);
  return v.length === (P.holes || []).length && v.every(x => x === v[0]) ? v[0] : null;
}

function huvudHtml() {
  const komb = kombination();
  const stammer = P ? Plan.stammerMedProfil(P, komb) : null;
  const tid = P ? new Date(P.updatedAt).toLocaleString("sv-SE",
    { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const rader = [];
  if (P.summary) rader.push(`<p class="sub" style="margin:0">${esc(P.summary)}</p>`);
  if (P.kind === "tom") {
    rader.push(`<p class="hint" style="margin:0">Tom plan — skriv in den själv.
      Du kan räkna en när du vill; dina egna rader följer med.</p>`);
  }
  const delat = P.kind === "tom" ? null : delatVillkor();
  if (delat) rader.push(`<p class="hint" style="margin:8px 0 0">${esc(delat)}</p>`);
  rader.push(`<p class="hint" style="margin:8px 0 0">${esc(P.spec)} ·
    sparad ${esc(tid)}${P.profil && P.profil.drive ? " · profil " + esc(P.profil.drive) : ""}</p>`);
  const varning = stammer === false
    ? `<div class="banner">Planen är räknad på en annan profil än den du har nu.
       Talen är inte fel — men de är inte dina. Räkna om planen.</div>` : "";
  return `<div class="card">${rader.join("")}</div>${varning}`;
}

function slagHtml(kort, s) {
  const t = Plan.slagtext(kort, s);
  const lank = Plan.siktLank(kort, s);
  return `<div class="slag">
    <span class="nr">${s.nr}</span>
    <span class="tx"><span class="et">${esc((s.rubrik || "").split("·").pop().trim())}</span><br>
      <span class="${t.kalla === "egen" ? "egen" : ""}">${esc(t.text)}</span></span>
    ${lank ? `<a class="sikt" href="${esc(lank)}" title="Öppna siktet i planeringsvyn">3D ›</a>` : ""}
  </div>`;
}

function redigeraHtml(kort) {
  const e = kort.egen;
  const slagfalt = kort.shots.map(s => `
    <label class="f">Slag ${s.nr} — egen text</label>
    <input class="f" data-slag="${s.nr}" value="${esc(e.slagtext[String(s.nr)] || "")}"
      placeholder="${esc(s.text)}">`).join("");
  return `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:6px">
    <label class="f">Målscore</label>
    <input class="f" id="mal" type="number" inputmode="numeric" min="1" max="15"
      value="${e.mal != null ? e.mal : ""}"
      placeholder="${kort.expected_score != null ? Math.round(kort.expected_score) : ""}">
    <label class="f">Anteckning</label>
    <textarea class="f" id="ant" placeholder="Vad du vill komma ihåg på teen">${esc(e.anteckning)}</textarea>
    ${slagfalt}
    <div class="verktyg">
      <button data-klar="1">Klar</button>
      <button data-ater="1">Återställ hålet</button>
    </div>
  </div>`;
}

function halHtml(kort) {
  const m = Plan.mal(kort);
  const oppen = redigerar === kort.rel;
  const kropp = [];
  if (kort.malscore) kropp.push(`<p class="rad-info">${esc(kort.malscore)}</p>`);
  if (kort.shots.length) {
    kropp.push(`<div style="margin-top:4px">${kort.shots.map(s => slagHtml(kort, s)).join("")}</div>`);
  } else if (!oppen) {
    kropp.push(`<p class="hint" style="margin:6px 0 0">${kort.saknas
      ? "Ingen plan för det här hålet — tryck Ändra och skriv din egen."
      : "Inga slag ännu — tryck Ändra och skriv din egen plan för hålet."}</p>`);
  }
  /* Beslutet står som en EGEN rad och inte inne i slagtexten: det är hålets
     enda fråga, och den ska gå att hitta utan att läsa raden före (§5.2). */
  for (const r of (kort.rader || [])) {
    if (r.sort === "alternativ") kropp.push(`<p class="rad-info val">${esc(r.text)}</p>`);
  }
  if (kort.i_spel) kropp.push(`<p class="rad-info risk">${esc(kort.i_spel)}</p>`);
  if (kort.undvik) kropp.push(`<p class="rad-info risk">${esc(kort.undvik)}</p>`);
  if (kort.stil) kropp.push(`<p class="rad-info">${esc(kort.stil)}</p>`);
  // Förutsättningarna per hål bara när de skiljer sig åt inom rundan (annars
  // står de en gång överst).
  if (kort.villkor && !delatVillkor()) {
    kropp.push(`<p class="hint" style="margin:8px 0 0">${esc(kort.villkor)}</p>`);
  }
  if (kort.egen.anteckning) {
    kropp.push(`<div class="anteckning">${esc(kort.egen.anteckning)}</div>`);
  }
  const lank = Planrunda.planvyLank(kort);
  kropp.push(oppen ? redigeraHtml(kort)
    : `<div class="verktyg">
        ${lank ? `<a class="knapplank" href="${esc(lank)}">Öppna i kartan</a>` : ""}
        <button data-red="${kort.rel}">Ändra</button>
      </div>`);

  return `<div class="card hal${kort.beslut ? " beslut" : ""}" data-hal="${kort.rel}">
    <div class="halhuv">
      <span class="tx"><span class="rub">${esc(kort.rubrik)}</span>
        <span class="fak">${esc(kort.fakta)}</span></span>
      <span class="mal ${m.kalla === "egen" ? "egen" : ""}">
        <b>${m.value != null ? esc(m.value) : "–"}</b><span>mål</span></span>
    </div>
    <div class="halkropp">${kropp.join("")}</div>
  </div>`;
}

/* Den kompakta raden: hålet, målet och planens FÖRSTA slag i en rad. Det är den
   formen 17 av 18 hål förtjänar när banan inte ställer någon fråga där —
   tryck fäller ut hela kortet. */
function radHtml(kort) {
  const m = Plan.mal(kort);
  const forsta = kort.shots && kort.shots[0]
    ? Plan.slagtext(kort, kort.shots[0]).text : "";
  return `<button class="halrad" data-oppna="${kort.rel}" type="button">
    <span class="h">${kort.rel}</span>
    <span class="p"><b>${esc(kort.fakta || "")}</b>${
      forsta ? `<span class="s">${esc(forsta)}</span>` : ""}${
      Plan.harEget(kort) ? '<span class="egenmark">din text</span>' : ""}</span>
    <span class="m">${m.value != null ? esc(m.value) : "–"}</span>
  </button>`;
}

/* Yardage-guiden: hela rundan på en skärm, som en banguide. Talen är hålkortens
   egna — listan är en annan LÄSNING av samma plan, inte en andra uträkning. */
function yardageHtml() {
  const rader = P.holes.map(k => {
    const m = Plan.mal(k);
    return `<div class="yard"><span class="h">Hål ${k.rel}</span>
      <span class="p">${esc(k.par != null ? "par " + k.par : "–")}${
        k.hole_dist != null ? " · " + Math.round(k.hole_dist) + " m" : ""}</span>
      <span class="m">${m.value != null ? esc(m.value) : "–"}</span></div>`;
  }).join("");
  return `<div class="card"><p class="hint" style="margin:0 0 6px">Yardage-guide</p>
    <div class="lista">${rader}</div></div>`;
}

function tomtHtml() {
  const komb = kombination();
  return `<div class="card">
      <p class="sub" style="margin:0 0 6px">Du har ingen plan för ${esc(spec())} än.</p>
      <p class="hint" style="margin:0">Planen räknas i telefonen, på din profil
        ${komb ? `(<b>${esc(komb.drive)}</b>)` : ""} — inget nät behövs.
        Med nät hämtas dagens vind först; utan blir planen vindstilla, och det
        står på varje hål.</p>
    </div>
    <div class="knappar">
      <button class="btn" id="gen"${jobbar ? " disabled" : ""}>${
        jobbar ? esc(framsteg || "Räknar …") : "Räkna planen"}</button>
    </div>
    <div class="knappar">
      <button class="btn ghost" id="tom">Tom plan att fylla i själv</button>
    </div>
    <p class="hint">Planen påverkar aldrig en pågående runda eller din score.</p>`;
}

/* BESLUTSFÖRST (§SP5). Rundans få beslut ligger överst som hela kort; resten är
   en lista man kan fälla ut. Ordningen är en LÄSNING — dokumentet lagras alltid
   i spelordning, för det är den ordningen hålen spelas i. */
function halavsnitt() {
  const { beslut, ovriga } = Planrunda.beslutForst(P.holes);
  const bitar = [];
  if (beslut.length) {
    bitar.push(`<p class="avsnitt">Rundans beslut</p>`);
    bitar.push(beslut.map(halHtml).join(""));
    bitar.push(`<p class="avsnitt">Resten av rundan</p>`);
  } else if (P.kind !== "tom") {
    bitar.push(`<p class="avsnitt">Rundan hål för hål</p>`);
  }
  // Ett hål man öppnat (eller redigerar) visas som helt kort mitt i listan.
  bitar.push(ovriga.map(k => (oppna.has(k.rel) || redigerar === k.rel)
    ? halHtml(k) : radHtml(k)).join(""));
  return bitar.join("");
}

function render() {
  const huvud = `<div class="top">
      <a class="back" href="./planera.html" aria-label="tillbaka">‹</a>
      <div><h1 class="identitet">📋 Min plan</h1></div>
    </div>`;
  if (!P) { app.innerHTML = huvud + tomtHtml(); koppla(); return; }
  app.innerHTML = huvud + huvudHtml()
    + halavsnitt()
    + yardageHtml()
    + `<div class="knappar">
        <button class="btn" id="gen"${jobbar ? " disabled" : ""}>${
          jobbar ? esc(framsteg || "Räknar …") : "Räkna om"}</button>
      </div>
      <div class="knappar"><button class="btn ghost" id="bort">Ta bort planen</button></div>
      <p class="hint">Dina egna rader följer med när planen räknas om.</p>`;
  koppla();
}

function koppla() {
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
  on("gen", generera);
  on("tom", tomPlan);
  on("bort", async () => {
    if (!confirm("Ta bort planen? Dina anteckningar försvinner med den.")) return;
    await Store.removePlan(P.id);
    P = null; redigerar = null; render();
  });

  app.querySelectorAll("[data-red]").forEach(b => {
    b.onclick = () => { redigerar = +b.dataset.red; render(); };
  });
  // Den kompakta raden fälls ut till hela kortet — och fälls ihop igen.
  app.querySelectorAll("[data-oppna]").forEach(b => {
    b.onclick = () => {
      const rel = +b.dataset.oppna;
      if (oppna.has(rel)) oppna.delete(rel); else oppna.add(rel);
      render();
    };
  });

  /* Redigeringen sparas när fältet lämnas, inte vid varje tangenttryck: en
     skrivning per bokstav hade betytt en IndexedDB-skrivning per bokstav. */
  const rel = redigerar;
  if (rel == null) return;
  const spara = fn => { P = Store.savePlan(fn(P)); };
  const el = id => document.getElementById(id);
  if (el("mal")) el("mal").onchange = e => spara(p => Plan.sattMal(p, rel, e.target.value));
  if (el("ant")) el("ant").onchange = e => spara(p => Plan.sattAnteckning(p, rel, e.target.value));
  app.querySelectorAll("[data-slag]").forEach(i => {
    i.onchange = () => spara(p => Plan.sattSlagtext(p, rel, +i.dataset.slag, i.value));
  });
  app.querySelectorAll("[data-klar]").forEach(b => {
    b.onclick = () => { redigerar = null; render(); };
  });
  app.querySelectorAll("[data-ater]").forEach(b => {
    b.onclick = () => {
      if (!confirm("Ta bort det du skrivit på hålet? Planens egna rader står kvar.")) return;
      spara(p => Plan.aterstall(p, rel));
      render();
    };
  });
}

/* ---------- start ---------- */
(async () => {
  await Store.ready();
  await laddaBanmeta();
  // Senast sparade plan för DAGENS slingkombination. En plan för 10–27 är inte
  // svaret på "vad är min plan för 1–18", och att visa den vore att svara på en
  // annan fråga än den som ställdes.
  const alla = await Store.plans();
  P = alla.find(x => x.spec === spec()) || null;
  render();
})();
</script>
<script>
/* Håll navigeringen inne i hemskärms-appen (iOS standalone) — samma som övriga sidor. */
(function () {
  var standalone = ("standalone" in navigator && navigator.standalone)
    || matchMedia("(display-mode: standalone)").matches;
  if (!standalone) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var url = new URL(a.getAttribute("href"), location.href);
    if (url.origin !== location.origin) return;
    e.preventDefault();
    location.href = url.href;
  });
})();
</script>
