<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16221e"><!-- = --bg i tokens.css; meta läser inte CSS-variabler -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planera runda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="./boot.js"></script>
<title>Planera runda</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 12px 14px 40px; }
  .top { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .top a.back { color: var(--ink); text-decoration: none; font-size: 22px;
    padding: 4px 10px 4px 2px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--dim); font-size: 14px; margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin: 10px 0; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  select.field { width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--panel-svag); color: var(--ink); }
  .tools { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .tool { display: flex; align-items: center; gap: 14px; text-decoration: none;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 16px 14px; color: var(--ink); }
  .tool .ic { font-size: 28px; flex: none; width: 34px; text-align: center; }
  .tool .tx { flex: 1; min-width: 0; }
  .tool .tt { font-size: 17px; font-weight: 700; }
  .tool .td { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .tool .arr { color: var(--dim); font-size: 20px; flex: none; }
  .tool:active { background: var(--accent-ui-yta); }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.5; }
  .banner { background: var(--amber-yta); border: 1px solid var(--amber-kant); color: var(--amber-ink);
          border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="back" href="./index.html" aria-label="tillbaka">‹</a>
    <div>
      <h1 class="identitet">🗓 Planera runda</h1>
    </div>
  </div>

  <div class="card">
    <label for="bana">Bana</label>
    <select class="field tee-val" id="bana"></select>
    <label for="round">Runda</label>
    <select class="field tee-val" id="round"></select>
    <label for="hole">Hål</label>
    <select class="field tee-val" id="hole"></select>
  </div>

  <!-- U11: EN ingång. Förut stod här tre (3D-genomgång, Planera slag,
       Green-lutning) — tre sidor med tre egna tillstånd, där man kunde stå på
       olika hål i två av dem samtidigt. Funktionerna finns kvar allihop, men
       inne i vyn: 2D och 3D är två kameravinklar på samma hål, och lutningen
       är en toggle. Det som togs bort är VALET, inte det man kunde göra. -->
  <div class="tools" id="tools">
    <a class="tool" id="topna" href="#">
      <span class="ic">⛳</span>
      <span class="tx"><span class="tt">Öppna hålet</span>
        <span class="td">2D och 3D, slagkedja och green-lutning i samma vy</span></span>
      <span class="arr">›</span></a>
    <!-- GP3: planen som TEXT — det man läser på teen, och det enda i appen som
         finns kvar när nätet inte gör det. Ligger bredvid hålvyn och inte inuti
         den: en plan är hela rundan, inte ett hål. -->
    <a class="tool" id="tplan" href="./plan.html">
      <span class="ic">📋</span>
      <span class="tx"><span class="tt">Min plan</span>
        <span class="td">Målscore och slag för slag, för hela rundan — läsbar offline</span></span>
      <span class="arr">›</span></a>
  </div>

  <div id="err"></div>
</div>

<script src="./round.js"></script>
<script>
"use strict";
// Plan-hub: välj bana + runda + hål, öppna sedan ett verktyg (3D / 2D-slag /
// green-lutning). Ingen GPS, ingen live, rör aldrig rundan (Store).
//
// Bana/runda/hål för PLANERING hålls medvetet ISÄR från Spelas motsvarande val
// (sg_course/sg_round): att bläddra bland banor här ska inte tysta ändra vad
// Spela är inställd på, och tvärtom. Egna nycklar: sg_plan_course, sg_plan_round,
// sg_plan_hole. Verktygen (Öppna hålet / Min plan) läser däremot fortfarande
// den GLOBALT aktiva banan (SGRound-singleton) — de har inget eget
// bana-medvetande — så vi synkar singleton till plan-valet i samma ögonblick
// man trycker sig vidare in i ett verktyg, inte tidigare.
const $ = id => document.getElementById(id);

let byGlobal = {};
let coursesRegistry = null;
let planMeta = null;   // aktiv PLANERING-bana (skild från SGRound:s aktiva bana)
let planTables = null; // SGRound.tablesFor(planMeta)

function loadCourses() {
  if (coursesRegistry) return Promise.resolve(coursesRegistry);
  return fetch("./data/courses.json", { cache: "no-cache" }).then(r => r.json())
    .then(list => (coursesRegistry = Array.isArray(list) && list.length ? list : null))
    .catch(() => null);
}

function planRoundName() {
  const n = localStorage.getItem("sg_plan_round");
  if (planTables.ROUND_SEQ[n]) return n;
  return (planMeta.rounds && planMeta.rounds[0] && planMeta.rounds[0].value) || "1-18";
}

function currentRel() {
  const v = parseInt($("hole").value, 10);
  const seq = planTables.ROUND_SEQ[planRoundName()];
  return v >= 1 && v <= seq.length ? v : 1;
}

// Ingångens href efter valt hål. Synka singleton-banan till plan-valet HÄR —
// det är först nu, när man faktiskt går in i ett verktyg, som den delade
// aktiva banan behöver stämma (verktygen har ingen egen bana-parameter).
function syncLinks() {
  const rel = currentRel();
  try {
    localStorage.setItem("sg_plan_hole", String(rel));
    localStorage.setItem("sg_hole", String(rel));
  } catch (e) {}
  SGRound.setActiveCourse(planMeta);
  try { localStorage.setItem("sg_round", planRoundName()); } catch (e) {}
  $("topna").href = `planvy.html?hal=${rel}`;
}

// Fyll runda-väljaren för vald PLANERING-bana (kan skilja sig från Spelas).
function fillRounds() {
  const sel = $("round");
  sel.innerHTML = "";
  (planMeta.rounds || []).forEach(r => {
    const o = document.createElement("option");
    o.value = r.value; o.textContent = r.label;
    sel.appendChild(o);
  });
  sel.value = planRoundName();
}

// Fyll hål-väljaren för vald runda (spelarens 1–18 med loop/lokalnummer + par).
function fillHoles() {
  const seq = planTables.ROUND_SEQ[planRoundName()] || planTables.ROUND_SEQ["1-18"];
  const sel = $("hole");
  const want = parseInt(localStorage.getItem("sg_plan_hole"), 10);
  sel.innerHTML = "";
  seq.forEach((g, i) => {
    const rel = i + 1, h = byGlobal[g];
    const o = document.createElement("option");
    o.value = String(rel);
    const meter = h && h.length_m ? ` ${Math.round(h.length_m)}m` : "";
    o.textContent = h ? `Hål ${rel} Par ${h.par ?? "–"}${meter}` : `Hål ${rel}`;
    sel.appendChild(o);
  });
  sel.value = String(want >= 1 && want <= seq.length ? want : 1);
  syncLinks();
}

// Ladda banans hålnamn (för vald PLANERING-bana) och fyll om hål-väljaren.
async function loadHolesAndFill() {
  byGlobal = {};
  $("err").innerHTML = "";
  try {
    const d = await (await fetch("data/" + (planMeta.mobile_json || "burlov.json"))).json();
    for (const h of d.holes) byGlobal[planTables.GLOBAL_BASE[h.loop] + h.hole] = h;
  } catch (e) {
    $("err").innerHTML = `<div class="banner">Kunde inte ladda bandata — hålval visas utan namn.</div>`;
  }
  fillHoles();
}

function fillBanor() {
  const sel = $("bana");
  const list = coursesRegistry || [planMeta];
  sel.innerHTML = list.map(c =>
    `<option value="${c.slug}"${c.slug === planMeta.slug ? " selected" : ""}>${c.name}</option>`
  ).join("");
}

(async () => {
  await loadCourses();
  const storedSlug = localStorage.getItem("sg_plan_course") || SGRound.activeSlug();
  planMeta = (coursesRegistry && coursesRegistry.find(c => c.slug === storedSlug))
    || SGRound.meta || SGRound.BURLOV_DEFAULT;
  planTables = SGRound.tablesFor(planMeta);

  fillBanor();
  $("bana").onchange = () => {
    const slug = $("bana").value;
    planMeta = (coursesRegistry && coursesRegistry.find(c => c.slug === slug)) || planMeta;
    planTables = SGRound.tablesFor(planMeta);
    try { localStorage.setItem("sg_plan_course", planMeta.slug || ""); } catch (e) {}
    try { localStorage.removeItem("sg_plan_round"); } catch (e) {}
    fillRounds();
    loadHolesAndFill();
  };

  fillRounds();
  $("round").onchange = () => {
    try { localStorage.setItem("sg_plan_round", $("round").value); } catch (e) {}
    fillHoles();
  };
  $("hole").onchange = syncLinks;

  await loadHolesAndFill();
})();
</script>
<script>
/* Håll navigeringen inne i hemskärms-appen (iOS standalone) — samma som övriga sidor. */
(function () {
  var standalone = ("standalone" in navigator && navigator.standalone)
    || matchMedia("(display-mode: standalone)").matches;
  if (!standalone) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var url = new URL(a.getAttribute("href"), location.href);
    if (url.origin !== location.origin) return;
    e.preventDefault();
    location.href = url.href;
  });
})();
</script>
</body>
</html>
