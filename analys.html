<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c2e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Analys">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<title>Analys</title>
<style>
  :root { --bg:#0c2e22; --card:#123c2d; --ink:#e8f5ec; --dim:#9fc4ae;
          --line:#1f5540; --accent:#37b06b; --accent-ink:#06180f;
          --miss:#e0a64e; --danger:#e26a5a; --good:#7ee2a8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { max-width:480px; margin:0 auto; padding:14px 16px 96px; }
  h1 { font-size:21px; font-weight:700; margin:8px 0 2px; letter-spacing:.2px; }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;
       color:var(--dim); margin:0 0 12px; }
  .sub { color:var(--dim); font-size:14px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:14px 16px; margin:12px 0; }
  a.card { display:block; text-decoration:none; color:inherit; }
  a.card:active { background:#164434; }
  /* trendkortet (A5) — samma korthöjd som en rundrad, men med en liten pil så
     det syns att det leder vidare (rundraderna har ingen egen affordance). */
  .trendcard .tt { display:flex; align-items:center; justify-content:space-between; }
  .trendcard h2 { margin:0; }
  .trendcard .arrow { color:var(--dim); font-size:18px; }
  .trendcard .sub { margin:4px 0 0; font-size:13px; }
  /* fem trendserier — sparkline + rullande snitt, samma inline-SVG-språk som
     greenkartan (A9): ingen Chart.js, offline och lätt. */
  .tcard h2 { margin-bottom:4px; }
  .tcard .n { color:var(--dim); font-weight:600; text-transform:none; letter-spacing:0; }
  .tchart { width:100%; height:auto; display:block; margin-top:6px; }
  .tchart circle { cursor:default; }
  .tempty { color:var(--dim); font-size:13px; margin:6px 0 0; }
  /* hero — fyra nyckeltal */
  .kpis { display:flex; }
  .kpi { flex:1; text-align:center; position:relative; }
  .kpi + .kpi::before { content:""; position:absolute; left:0; top:12%; bottom:12%;
    width:1px; background:var(--line); }
  .kpi .big { display:block; font-size:27px; font-weight:700; line-height:1.15;
    font-variant-numeric:tabular-nums; }
  .kpi .lbl { display:block; color:var(--dim); font-size:11px; margin-top:3px;
    text-transform:uppercase; letter-spacing:.5px; }
  .kpi .sml { display:block; color:var(--dim); font-size:11px; margin-top:1px;
    font-variant-numeric:tabular-nums; }
  .pos { color:var(--good); } .neg { color:var(--danger); }
  /* green-precisionskarta */
  .greenwrap { display:flex; flex-direction:column; align-items:center; }
  .greenwrap svg { width:100%; max-width:280px; height:auto; }
  .missgrid { display:flex; gap:8px; width:100%; margin-top:12px; }
  .missbox { flex:1; text-align:center; }
  .missbox .mv { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .missbox .ml { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .subline { color:var(--dim); font-size:13px; text-align:center; margin-top:12px;
    font-variant-numeric:tabular-nums; }
  /* fairway-korridor */
  .corridor { position:relative; height:48px; background:#0e3326; border-radius:10px;
    margin:6px 0 12px; overflow:hidden; }
  .corridor .mid { position:absolute; left:50%; top:0; bottom:0; width:2px;
    background:var(--accent); opacity:.5; }
  .corridor .dot { position:absolute; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; }
  /* A9: linjal var 10:e meter + tryckbara prickar. Länken är en punkt utan egen
     yta — träffytan är prickens, förstorad till 28 px så den går att träffa med
     en tumme (WCAG-minimum är 24). `a.slag` ärver ingen länkfärg: färgen bär
     redan betydelse (träff/miss, landningsyta). */
  .corridor .grid { position:absolute; top:0; bottom:0; width:1px;
    background:var(--line); opacity:.55; }
  .corridor .gm { position:absolute; bottom:2px; transform:translateX(-50%);
    color:var(--dim); font-size:9px; white-space:nowrap; }
  .corridor .gm.gr { transform:translateX(-100%); }
  .corridor a { display:contents; }
  .greenwrap a circle, .corridor a .dot { cursor:pointer; }
  .greenwrap a:focus-visible circle { outline:2px solid var(--accent); }
  .corridor a .dot::after { content:""; position:absolute; left:50%; top:50%;
    width:28px; height:28px; transform:translate(-50%,-50%); }
  .foot { color:var(--dim); font-size:12px; line-height:1.4; margin-top:2px; }
  /* enkla rader (scorefördelning) */
  .row { display:flex; align-items:center; gap:10px; margin:9px 0; }
  .row .rl { width:110px; font-size:13px; color:var(--dim); }
  .row .bar { flex:1; height:10px; background:#0e3326; border-radius:5px; overflow:hidden; }
  .row .bar > i { display:block; height:100%; border-radius:5px; }
  .row .rn { width:26px; text-align:right; font-size:13px; font-weight:700;
    font-variant-numeric:tabular-nums; }
  .cells { display:flex; gap:8px; text-align:center; }
  .cell { flex:1; }
  .cell .cv { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .cell .cd { font-size:12px; font-weight:600; }
  .cell .cl { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  /* hål-tabell */
  table { width:100%; border-collapse:collapse; font-size:15px;
    font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:8px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase;
    letter-spacing:.4px; }
  td.under { color:var(--good); } td.over { color:var(--danger); } td.dimc { color:var(--dim); }
  .gy { color:var(--good); } .gn { color:var(--dim); }
  .total td { font-weight:700; border-bottom:none; }
  .note { color:var(--dim); font-size:12px; line-height:1.4; margin:10px 2px 0; }
  .empty { text-align:center; padding:32px 16px; }
  .empty .big { font-size:16px; font-weight:700; margin:0 0 8px; }
  .empty .txt { color:var(--dim); font-size:14px; line-height:1.45; margin:0 0 16px; }
  .empty a.btn { display:inline-block; text-decoration:none; background:var(--accent);
    color:var(--accent-ink); font-weight:700; font-size:15px; padding:11px 22px; border-radius:12px; }
  /* ---------- rundlistan (§2.6) ---------- */
  .rrow { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin:10px 0; }
  .rrow:active { background:#164434; }
  .rrow .rmain { flex:1; min-width:0; }
  .rrow .rtop { display:flex; align-items:baseline; gap:8px; }
  .rrow .rdate { font-size:15px; font-weight:700; }
  .rrow .rcourse { color:var(--dim); font-size:13px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .rrow .rmeta { color:var(--dim); font-size:12px; margin-top:3px; line-height:1.35; }
  .rrow .rnum { text-align:right; flex:none; }
  .rrow .rscore { font-size:23px; font-weight:700; font-variant-numeric:tabular-nums;
    line-height:1.1; }
  .rrow .rpar { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .rrow .rholes { color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .rrow.dimmed .rdate, .rrow.dimmed .rscore { color:var(--dim); }
  .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.5px;
    text-transform:uppercase; padding:2px 6px; border-radius:6px;
    background:#1a4c38; color:var(--dim); }
  .badge.lvl3 { background:#1d5c40; color:var(--good); }
  .badge.live { background:var(--accent); color:var(--accent-ink); }
  /* Molnstatus (MOLN_PLAN §7). Säkrad är avsiktligt DÄMPAD — det normala
     tillståndet ska inte skrika; det är "väntar" och "ej säkrad" som betyder
     något för användaren. */
  .badge.moln { background:transparent; border:1px solid var(--line); color:var(--dim); }
  .badge.moln.vantar { border-color:#7a5c1e; color:#d8a63a; }
  .badge.moln.nekad { border-color:#7a2f2f; color:#e08585; }
  .lgroup { color:var(--dim); font-size:12px; text-transform:uppercase;
    letter-spacing:.6px; margin:18px 2px 2px; }
  .back { display:inline-block; color:var(--dim); text-decoration:none; font-size:14px;
    padding:6px 0; margin:0 0 2px; }
  .danger-btn { display:block; width:100%; background:none; color:var(--danger);
    border:1px solid var(--line); border-radius:12px; padding:11px 14px;
    font-size:14px; font-weight:600; font-family:inherit; margin-top:4px; }
  .storage { color:var(--dim); font-size:12px; line-height:1.5; margin:16px 2px 0; }
  /* flik-rad: bas-CSS:en bor i nav.js (AS-IA steg 1, §2.8.1). Denna sida
     avviker — ingen gap och smalare sidopadding, i takt med sidans egna
     #app-mått. Måste stå FÖRE @supports-blocket nedan, som i sin tur
     skriver över .tabs i app-shell-läget. */
  .tabs { gap:0; padding:6px 8px calc(env(safe-area-inset-bottom) + 6px); }
  @supports (height: 100lvh) {
    @media (display-mode: standalone) {
      body { height: 100lvh; display: flex; flex-direction: column;
             overflow: hidden; padding: 0; }
      #app { flex: 1 1 auto; min-height: 0; overflow-y: auto;
             -webkit-overflow-scrolling: touch;
             padding: calc(env(safe-area-inset-top) + 14px)
                      calc(env(safe-area-inset-right) + 16px) 16px
                      calc(env(safe-area-inset-left) + 16px); }
      .tabs { position: static; padding: 6px 8px 8px; }
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="./nav.js"></script>
<script src="./round.js"></script>
<script src="./score.js"></script>
<script src="./spelprofil.js"></script>
<script src="./store.js"></script>
<script src="./analys-core.js"></script>
<script src="./analys-lista.js"></script>
<script src="./analys-trend.js"></script>
<script src="./sg.js"></script>
<script>
"use strict";
/* Analys efter rundan — räknas helt i telefonen ur rundorna i Store
   (APPSTORE_PLAN §9.1) + banans <slug>.json. Ingen PC/server/tunnel.
   Slag-modell och mått: analys-core.js (facit-speglad, se ANALYS_MOBIL_V1_BRIEF).
   Listmodellen: analys-lista.js (ren, node-testad).

   TRE VYER (§2.6, §9.3, §10 A5):
     analys.html              → rundlistan, en rad per runda ur Store.list()
     analys.html?round=<id>   → analysen av EN runda
     analys.html?trend=1      → trend över rundhistoriken (A5), nås från ett
                                 kort överst i rundlistan

   Vyval via query-param, inte internt state: bakåtknappen och flik-länken
   fungerar då av sig själva, och en runda (eller trenden) går att länka till.

   VIKTIGT — en historisk runda läses med SIN EGEN banas tabeller. Före §9.3
   läste sidan `SGRound.seq()`/`mobileJson()`/`GLOBAL_BASE`, dvs. den bana som
   råkade vara AKTIV. Analysen av en gammal Burlöv-runda blev då fel så fort man
   bytt till en annan bana. Rundan bär `courseSlug` + `roundSeq` (§9.1.3) och
   hålen bär sitt frysta `global` — det är de som gäller här. */

function esc(s) { return String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const fmtDiff = d => d === 0 ? "E" : (d > 0 ? "+" + d : String(d));
const pct = v => v == null ? "–" : Math.round(v) + "%";
const m1 = v => v == null ? "–" : (v < 10 ? v.toFixed(1) : Math.round(v)) + " m";

const roundIdFromUrl = () => {
  try { return new URLSearchParams(location.search).get("round"); } catch (e) { return null; }
};
const trendRequested = () => {
  try { return new URLSearchParams(location.search).get("trend") === "1"; } catch (e) { return false; }
};

/* ---------- banregistret (per slug, inte "aktiv bana") ----------
   Aktiv banas meta finns synkront i SGRound (och cachad i localStorage → funkar
   offline). Andra banors meta hämtas ur data/courses.json, som service workern
   precachar som app-shell — också offline. */
let registryP = null;
function loadRegistry() {
  if (registryP) return registryP;
  registryP = fetch("./data/courses.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(l => (Array.isArray(l) ? l : []))
    .catch(() => []);
  return registryP;
}
/* `namn` går FÖRE `slug` när det är känt. Store sätter `courseSlug` till den
   bana som var AKTIV när dokumentet skapades (store.js newDoc), medan
   `courseName` kommer ur rundan själv — en runda hydrerad ur molnet
   (docFromWire) bär därför rätt namn men fel slug om telefonen stod på en annan
   bana vid importen. Läst på slugen blev par, slingnamn och GIR fel utan att
   något såg trasigt ut. */
async function courseMetaFor(slug, namn) {
  const list = await loadRegistry();
  const påNamn = namn ? list.find(c => c.name === namn) : null;
  if (påNamn) return påNamn;
  const påSlug = slug ? list.find(c => c.slug === slug) : null;
  if (påSlug) return påSlug;
  if (!slug || slug === SGRound.activeSlug()) return SGRound.meta;
  return null;
}

/* Baslinjen (expected strokes) för SG. Laddas en gång; misslyckas den visas
   inget SG alls i stället för en gissad siffra. */
let baselineP = null;
function loadBaseline() {
  if (baselineP) return baselineP;
  baselineP = fetch("./data/baseline.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(j => { SG.load(j); return true; })
    .catch(() => false);
  return baselineP;
}

const courseDataCache = {};                 // mobile_json → Promise<{holes:[…]}>
function loadCourseData(file) {
  if (!file) return Promise.resolve(null);
  if (!courseDataCache[file]) {
    courseDataCache[file] = fetch("./data/" + file, { cache: "no-cache" })
      .then(r => r.json()).catch(() => null);
  }
  return courseDataCache[file];
}

/* Allt en vy behöver om EN rundas bana: slingtabeller, hål-tabell och
   par-summan för hela sekvensen. Cachas per (slug, roundSeq). */
const bandCache = {};
function bandsFor(slug, roundSeq, namn) {
  const key = slug + "|" + roundSeq + "|" + (namn || "");
  if (bandCache[key]) return bandCache[key];
  bandCache[key] = (async () => {
    const meta = await courseMetaFor(slug, namn);
    const tables = SGRound.tablesFor(meta || {});
    const seq = tables.ROUND_SEQ[roundSeq] || null;
    const data = meta ? await loadCourseData(meta.mobile_json) : null;
    const byGlobal = AnalysLista.byGlobalFrom(data, tables);
    return { meta, tables, seq, byGlobal,
             seqLength: seq ? seq.length : 0,
             par: AnalysLista.parForSeq(byGlobal, seq),
             hasData: !!(data && data.holes && data.holes.length) };
  })();
  return bandCache[key];
}

/* ---------- kort ---------- */
function heroHtml(A) {
  const toPar = A.nPlayed && A.totPar ? A.totScore - A.totPar : null;
  const diff = toPar == null ? `<span class="big">–</span>`
    : `<span class="big ${toPar < 0 ? "pos" : toPar > 0 ? "neg" : ""}">${fmtDiff(toPar)}</span>`;
  const kpi = (big, lbl, sml, cls) =>
    `<div class="kpi"><span class="big ${cls || ""}">${big}</span><span class="lbl">${lbl}</span>${sml ? `<span class="sml">${sml}</span>` : ""}</div>`;
  return `<div class="card"><div class="kpis">
    ${kpi(A.totScore || "–", "Score", A.nPlayed ? A.nPlayed + " hål" : "")}
    <div class="kpi">${diff}<span class="lbl">Mot par</span></div>
    ${kpi(pct(A.gir.pct), "GIR", A.gir.known ? A.gir.hit + "/" + A.gir.known : "", A.gir.pct >= 50 ? "pos" : "")}
    ${kpi(pct(A.scramble.pct), "Scrambling", A.scramble.elig ? A.scramble.ok + "/" + A.scramble.elig : "", A.scramble.pct >= 50 ? "pos" : "")}
  </div></div>`;
}

/* Landningsytornas färger (A3). Sanden är sandgul, vattnet blått, fairway dovt
   grönt och ruffen varnande — samma språk som kartan använder. */
const SURFACE_COL = { green: "var(--good)", bunker: "#d8c07a", water: "#5a9fd4",
                      fairway: "#4e9e6a", rough: "var(--miss)" };
const SURFACE_NAMN = { green: "green", bunker: "bunker", water: "vatten",
                       fairway: "fairway", rough: "ruff" };

// Green-precision: pin i mitten, inspelen placerade kort/lång × vänster/höger.
/* ---------- A9: en prick ska gå att förstå OCH att gå tillbaka till ----------

   Två tillägg som gäller båda precisionsdiagrammen (inspel och utslag), av
   samma skäl: ett spridningsdiagram säger VAD som hände men inte VILKET slag
   det var, och just den frågan är den man ställer när man ser en avvikare.

   · `punktText` — hela historien i en rad. Visas som `<title>` (hovertext med
     mus) och som `aria-label`; på en telefon finns ingen hover, och där är
     svaret i stället ett tryck: kartan öppnas med slaget markerat, och den
     bär samma uppgifter i slaglistan.
   · `slaglank` — trycket. Kräver hål OCH slagnummer; saknas något ritas
     pricken utan länk i stället för en länk som landar på fel slag. */
function punktText(p) {
  const bitar = [];
  if (p.hole != null) bitar.push("Hål " + p.hole);
  if (p.from != null) bitar.push("inspel från " + m1(p.from));
  if (p.onGreen) bitar.push("på green");
  else {
    const rikt = [];
    if (Math.abs(p.along) >= 1) rikt.push(m1(Math.abs(p.along)) + (p.along < 0 ? " kort" : " lång"));
    if (Math.abs(p.cross) >= 1) rikt.push(m1(Math.abs(p.cross)) + (p.cross < 0 ? " vänster" : " höger"));
    if (rikt.length) bitar.push(rikt.join(", "));
    if (p.edge != null) bitar.push(m1(p.edge) + " utanför green");
  }
  if (p.surface && SURFACE_NAMN[p.surface]) bitar.push(SURFACE_NAMN[p.surface].toLowerCase());
  return bitar.join(" · ");
}

function punktTextUtslag(p) {
  const bitar = [];
  if (p.hole != null) bitar.push("Hål " + p.hole);
  if (p.length != null) bitar.push("utslag " + m1(p.length));
  const v = p.lateral;
  if (v != null) bitar.push(Math.abs(v) < 1 ? "på linjen"
    : m1(Math.abs(v)) + (v < 0 ? " vänster" : " höger") + " om mittlinjen");
  if (p.hit === true) bitar.push("på fairway");
  else if (p.hit === false) bitar.push("utanför fairway");
  return bitar.join(" · ");
}

function slaglank(S, p, inner, titel) {
  if (!S || !S.id || p.hole == null || p.shot == null) return inner;
  const url = `./rundkarta.html?round=${encodeURIComponent(S.id)}&hal=${p.hole}&slag=${p.shot}`;
  return `<a href="${url}" aria-label="${esc(titel)}">${inner}</a>`;
}

function greenMapHtml(A, S) {
  const m = A.approach;
  if (!m.n) return `<div class="card"><h2>Greenprecision</h2>
    <p class="foot">Inga inspel med känd pin och boll-på-green än. Markera pinnen
    och boll på green när du loggar, så visas här var och hur mycket inspelen missar.</p></div>`;

  /* A9: RINGARNA ÄR ALLTID 10 METER. Förut valdes ringavståndet efter rundans
     värsta miss (5/10/20 m), så samma bildyta betydde olika saker från runda
     till runda — och en prick "två ringar ut" gick inte att jämföra med gårdagens.
     Ett fast steg gör diagrammet läsbart som en linjal: räkna ringar, multiplicera
     med tio. Antalet ringar växer i stället med rundan, och taket (6 ringar =
     60 m) klipper bara extremfall, som förut. */
  const C = 140, RMAX = 112, RING_M = 10, MAX_RINGAR = 6;
  const maxDist = Math.max(RING_M, ...m.pts.map(p => Math.hypot(p.along, p.cross)));
  const nRings = Math.min(MAX_RINGAR, Math.max(2, Math.ceil(maxDist / RING_M)));
  const sc = RMAX / (nRings * RING_M);
  const rings = Array.from({ length: nRings }, (_, i) => {
    const r = (i + 1) * RING_M * sc;
    // Etiketten sitter på uppåtaxeln, innanför sin egen ring — så avståndet går
    // att läsa av utan att räkna ringar.
    return `<circle cx="${C}" cy="${C}" r="${r.toFixed(1)}"
        fill="none" stroke="#1a4536" stroke-width="1"/>
      <text x="${C + 3}" y="${(C - r + 11).toFixed(1)}" fill="#6f9a83" font-size="9">${
        (i + 1) * RING_M} m</text>`;
  }).join("");
  const dots = m.pts.map(p => {
    let x = p.cross * sc, y = -p.along * sc;
    const r = Math.hypot(x, y); if (r > RMAX) { x *= RMAX / r; y *= RMAX / r; }
    // A3: färgen är LANDNINGSYTAN, inte bara träff/miss. Att veta att missen
    // låg i greenbunkern och inte på klippt gräs är hela skillnaden mellan
    // "kort vänster" och ett verkligt råd.
    const col = SURFACE_COL[p.surface] || (p.onGreen ? "var(--good)" : "var(--miss)");
    // A9: pricken är spårbar — hovertext med hela historien, och ett tryck
    // öppnar EXAKT det slaget på hålkartan. Utan hål och slagnummer i punkten
    // (analys-core) vore båda omöjliga.
    const titel = esc(punktText(p));
    const cirkel = `<circle cx="${(C + x).toFixed(1)}" cy="${(C + y).toFixed(1)}" r="4"
      fill="${col}" fill-opacity="0.92"><title>${titel}</title></circle>`;
    return slaglank(S, p, cirkel, titel);
  }).join("");
  const svg = `<svg viewBox="0 0 280 280" role="img" aria-label="Green-precisionskarta">
    <line x1="${C}" y1="20" x2="${C}" y2="260" stroke="#1a4536" stroke-width="1"/>
    <line x1="20" y1="${C}" x2="260" y2="${C}" stroke="#1a4536" stroke-width="1"/>
    ${rings}${dots}
    <circle cx="${C}" cy="${C}" r="3" fill="var(--accent)"/>
    <text x="${C}" y="14" fill="#9fc4ae" font-size="11" text-anchor="middle">Lång</text>
    <text x="${C}" y="274" fill="#9fc4ae" font-size="11" text-anchor="middle">Kort</text>
    <text x="4" y="${C - 4}" fill="#9fc4ae" font-size="11">Vänster</text>
    <text x="276" y="${C - 4}" fill="#9fc4ae" font-size="11" text-anchor="end">Höger</text>
  </svg>`;
  const box = (v, l) => `<div class="missbox"><div class="mv">${v}</div><div class="ml">${l}</div></div>`;
  const misses = m.n - m.onGreen;
  const edge = misses && m.medEdge != null
    ? `<p class="subline">Missarna hamnade i snitt ${m1(m.medEdge)} utanför green.</p>` : "";
  // A3: ytfördelningen i ord, med färgprick som knyter raden till kartan.
  // Bara ytor som FAKTISKT förekom listas — nollor säger ingenting.
  const YT = m.bySurface || {};
  const ytor = Object.keys(SURFACE_NAMN).filter(k => YT[k] > 0)
    .map(k => `<span style="white-space:nowrap"><span style="display:inline-block;width:8px;
      height:8px;border-radius:50%;background:${SURFACE_COL[k]};margin-right:4px"></span>${
      SURFACE_NAMN[k]} ${YT[k]}</span>`).join(" · ");
  const ytrad = ytor ? `<p class="subline">${ytor}</p>` : "";
  // En insikt värd namnet: greenbunkern kostar dyrt och är åtgärdbar.
  const bunkerRad = YT.bunker >= 2
    ? `<p class="foot">Inspelen hamnade i en greenbunker ${YT.bunker} gånger — det är
       den miss som kostar mest slag per tillfälle.</p>` : "";
  return `<div class="card"><h2>Greenprecision</h2>
    <div class="greenwrap">${svg}
      <div class="missgrid">${box(m.short, "kort")}${box(m.long, "lång")}${box(m.left, "vänster")}${box(m.right, "höger")}</div>
    </div>
    <p class="subline">${m.onGreen} av ${m.n} inspel träffade green.</p>${edge}${ytrad}${bunkerRad}
    <p class="foot">Varje ring är 10 m. Tryck på ett slag för att se det på hålkartan.</p>
  </div>`;
}

function fairwayHtml(A, S) {
  const t = A.tee;
  if (!t.n) return "";
  const box = (v, l) => `<div class="cell"><div class="cv">${v}</div><div class="cl">${l}</div></div>`;
  /* A9: korridoren har samma linjal som greenkartan — ETT streck var tionde
     meter, ±40 m ut. Förut var bredden bara "48 % = 40 m", vilket gjorde att
     man kunde se att ett utslag låg längre höger än ett annat men inte hur
     mycket. Samma clamp som förut behålls, så en riktigt vild boll ligger kvar
     i kanten i stället för att spränga skalan för alla andra. */
  const KORR_M = 40, STEG_M = 10;
  const px = v => 50 + Math.max(-KORR_M, Math.min(KORR_M, v)) / KORR_M * 48;
  const grid = [-40, -30, -20, -10, 10, 20, 30, 40].map(v =>
    `<div class="grid" style="left:${px(v).toFixed(1)}%"></div>`).join("")
    + `<span class="gm" style="left:${px(-KORR_M).toFixed(1)}%">${KORR_M} m V</span>`
    + `<span class="gm gr" style="left:${px(KORR_M).toFixed(1)}%">${KORR_M} m H</span>`;
  // A2: prickens färg är fairwayträffen. `hit == null` = banan saknar ytor →
  // okänt, och då behåller pricken den neutrala miss-färgen i stället för att
  // påstå en miss.
  const dots = t.pts.map(p => {
    const v = p && typeof p === "object" ? p.lateral : p;
    const hit = p && typeof p === "object" ? p.hit : null;
    const left = px(v);
    const col = hit === true ? "var(--good)" : hit === false ? "var(--miss)" : "var(--miss)";
    const titel = esc(punktTextUtslag(p && typeof p === "object" ? p : { lateral: v }));
    const prick = `<div class="dot" style="left:${left.toFixed(1)}%;background:${col}" title="${titel}"></div>`;
    return (p && typeof p === "object") ? slaglank(S, p, prick, titel) : prick;
  }).join("");
  const linjal = `<p class="foot">Streck var 10:e meter från mittlinjen.
    Tryck på ett utslag för att se det på hålkartan.</p>`;
  if (t.known) {                       // fairway-polygoner finns (<slug>.json v2)
    return `<div class="card"><h2>Fairway</h2>
      <div class="corridor">${grid}<div class="mid"></div>${dots}</div>
      <div class="cells">${box(t.left, "vänster")}${box(t.hit, "fairway")}${box(t.right, "höger")}</div>
      <p class="subline">${pct(t.hitPct)} av utslagen på fairway${
        t.known < t.n ? ` (${t.known} av ${t.n} utslag har fairwaydata)` : ""}.</p>
      ${linjal}
    </div>`;
  }
  return `<div class="card"><h2>Utslagens sidled</h2>
    <div class="corridor">${grid}<div class="mid"></div>${dots}</div>
    <div class="cells">${box(t.left, "vänster")}${box(t.n - t.left - t.right, "mitten")}${box(t.right, "höger")}</div>
    <p class="foot">Mot hålets mittlinje. Fairwayträff visas när banans fairway-ytor lagts till.</p>
    ${linjal}
  </div>`;
}

function puttHtml(A, sgPutt) {
  if (!A.nPlayed) return "";
  const box = (v, l, cls) => `<div class="cell"><div class="cv ${cls || ""}">${v}</div><div class="cl">${l}</div></div>`;
  /* SG puttning (AS5). Den enda SG-siffran som går att räkna helt säkert i
     klienten: läget är `green` per definition, så §9.5:s lie-paritetsgap rör
     den inte. Täckningen skrivs ut ärligt — den kräver både green-markör och
     pin, vilket inte alla hål har. */
  const sgRad = sgPutt && sgPutt.n
    ? `<p class="subline">Strokes Gained puttning:
        <b class="${sgPutt.total > 0 ? "pos" : sgPutt.total < 0 ? "neg" : ""}">${
          sgPutt.total > 0 ? "+" : ""}${sgPutt.total.toFixed(2)}</b>
        mot ${esc(sgPutt.label)} — räknat på ${sgPutt.n} av ${A.nPlayed} hål
        (kräver markerad boll på green och pin).</p>`
    : `<p class="foot">Strokes Gained puttning kräver att du markerar både boll på
        green och pinnen. Markera dem så räknas puttningen mot en baslinje.</p>`;
  return `<div class="card"><h2>Puttning</h2><div class="cells">
    ${box(A.putts.total || "–", "puttar")}
    ${box(A.putts.three, "trepputt")}
    ${box(A.putts.one, "enpputt")}
    ${box(A.putts.perGir != null ? A.putts.perGir.toFixed(2) : "–", "putt/GIR")}
  </div>${sgRad}</div>`;
}

/* SG puttning per runda. Rena indata: hålen ur dokumentet + bandatan.
   Hoppar över hål utan green-markör, pin eller puttar — och redovisar hur
   många som räknades i stället för att tysta bort dem. */
function puttSGForRound(doc, byGlobal) {
  if (!SG.loaded()) return null;
  let total = 0, n = 0;
  for (const h of (doc.holes || [])) {
    const band = byGlobal[h.global];
    const pin = AnalysCore.LL(h.pin) || AnalysCore.LL(band && band.pin);
    const green = AnalysCore.LL(h.green);
    if (!pin || !green || !(h.putts > 0)) continue;
    const d = AnalysCore.hav(green, pin);
    if (!isFinite(d)) continue;
    const sg = SG.puttingGained(d, h.putts);
    if (sg == null) continue;
    total += sg; n++;
  }
  const namn = SG.defaultName();
  return { total, n, label: (SG.labels()[namn] || namn) };
}

function distHtml(A) {
  if (!A.nPlayed) return "";
  const rows = [["Birdie el. bättre", A.dist.birdie, "var(--good)"], ["Par", A.dist.par, "var(--accent)"],
    ["Bogey", A.dist.bogey, "var(--miss)"], ["Dubbel el. mer", A.dist.dbl, "var(--danger)"]];
  return `<div class="card"><h2>Scorefördelning</h2>
    ${rows.map(([l, n, col]) => `<div class="row">
      <span class="rl">${l}</span>
      <span class="bar"><i style="width:${(n / A.nPlayed * 100).toFixed(0)}%;background:${col}"></i></span>
      <span class="rn">${n}</span></div>`).join("")}
  </div>`;
}

function parHtml(A) {
  const boxes = [3, 4, 5].filter(p => A.byPar[p] && A.byPar[p].n).map(p => {
    const b = A.byPar[p], avg = b.sum / b.n, d = avg - p;
    return `<div class="cell"><div class="cl">Par ${p}</div>
      <div class="cv">${avg.toFixed(1)}</div>
      <div class="cd ${d < -0.05 ? "pos" : d > 0.05 ? "neg" : ""}">${d > 0 ? "+" : ""}${d.toFixed(1)}</div></div>`;
  });
  return boxes.length ? `<div class="card"><h2>Snitt per par</h2><div class="cells">${boxes.join("")}</div></div>` : "";
}

    <tr class="total"><td>Totalt</td><td>${A.totPar || "–"}</td><td>${A.totScore || "–"}</td>

/* ================= vy 1: rundlistan (§2.6) =================
   Läser BARA indexrader — aldrig runddokumenten (§9.1.5). ±par kräver banans
   par-summa och fylls därför i EFTERÅT, när bandatan hämtats; listan renderas
   direkt så den aldrig väntar på nät. */

/* Molnbadgens hovertext — och den enda platsen som säger vad lägena BETYDER.

   "Säkrad" lovar backup, inte att rundan är analyserad någon annanstans:
   analysen räknas i telefonen (MOLN_PLAN §1b). "Väntar" är inte ett fel och
   ska inte låta som ett — svepet skickar den av sig själv när nätet finns
   (§6 V2b), utan att användaren gör något. "Ej säkrad" är det enda läget som
   kräver en människa, och då ska serverns egen text fram: den är skriven för
   att läsas (§6 V2b, 400/413). */
function molnTitel(s) {
  if (!s) return "";
  if (s.lage === "sakrad") {
    const när = s.nar ? new Date(s.nar).toLocaleString("sv-SE", {
      year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : null;
    return "Säkerhetskopierad i molnet" + (när ? " " + när : "")
      + ". Analysen räknas i telefonen — molnet är backup.";
  }
  if (s.lage === "nekad") {
    return "Kunde inte säkras: " + (s.fel || "molnet nekade rundan")
      + ". Rundan är komplett i telefonen och går att dela därifrån.";
  }
  // `fel` visas MEDVETET inte här. I väntläget är det `e.message` från fetch
  // ("Failed to fetch") eller "HTTP 500" — teknisk text i ett läge som inte är
  // ett fel. Bara den nekade grenen har en text som är skriven för en människa.
  return "Ligger bara i telefonen. Skickas automatiskt när nätet kommer tillbaka.";
}

function rowHtml(m) {
  const badge = m.active
    ? `<span class="badge live">pågår</span>`
    : `<span class="badge ${m.level === 3 ? "lvl3" : ""}" title="Loggning: ${esc(m.levelLong)}">${esc(m.levelShort)}</span>`;
  const moln = m.moln
    ? `<span class="badge moln ${m.moln.lage === "sakrad" ? "" : esc(m.moln.lage)}"
             title="${esc(molnTitel(m.moln))}">${esc(m.moln.text)}</span>` : "";
  const meta = [
    m.holesPlayed ? `${m.holesPlayed} hål` : "inga hål loggade",
    m.tee ? `tee ${esc(m.tee)}` : null,
    !m.active && m.level !== 3 ? `loggning: ${esc(m.levelLong)}` : null,
    m.coverage,
  ].filter(Boolean).join(" · ");
  const toPar = AnalysLista.fmtToPar(m.toPar);
  const parCls = m.toPar == null ? "" : m.toPar < 0 ? "pos" : m.toPar > 0 ? "neg" : "";
  return `<a class="rrow${m.empty ? " dimmed" : ""}" href="./analys.html?round=${encodeURIComponent(m.id)}">
    <span class="rmain">
      <span class="rtop"><span class="rdate">${esc(m.dateLabel)}</span>${badge}${moln}</span>
      <span class="rcourse">${esc(m.courseName)}${m.roundSeq ? " · " + esc(m.roundSeq) : ""}</span>
      <span class="rmeta">${meta}</span>
    </span>
    <span class="rnum">
      <span class="rscore">${m.strokes || "–"}</span>
      ${toPar ? `<span class="rpar ${parCls}">${toPar}</span>` : `<span class="rholes">slag</span>`}
    </span>
  </a>`;
}

/* Lagringsläget, ärligt (§9.1.11). Detta är enda stället i appen som visar om
   iOS lovat att INTE vräka rundorna — och det som gör beständighetsprovet
   läsbart på telefonen, utan devtools. */
async function storageHtml() {
  let info = null;
  try { info = await Store.storageInfo(); } catch (e) {}
  if (!info) return "";
  const mb = v => (v == null ? null : (v / 1048576).toFixed(v < 10485760 ? 1 : 0) + " MB");
  const anv = mb(info.usage), kvot = mb(info.quota);
  const bits = [];
  // Vilken publicerad version telefonen FAKTISKT kör. Service workerns
  // cache-namn bär sw.js:s VERSION, så detta kräver ingen byggstämpel — och
  // det är enda sättet att på telefonen se om en publicering slagit igenom
  // eller om PWA-cachen ligger kvar (se mobile/CLAUDE.md).
  try {
    const v = (await caches.keys()).filter(k => k.startsWith("sg-shell-v"))
      .map(k => k.replace("sg-shell-v", ""));
    if (v.length) bits.push("App-version: " + v.join(" + "));
  } catch (e) {}
  if (anv) bits.push(`Lagring: ${anv}${kvot ? " av " + kvot : ""}`);
  bits.push(info.persisted === true ? "beständig lagring: JA"
          : info.persisted === false ? "beständig lagring: NEJ (iOS kan rensa rundorna om appen inte används på länge)"
          : "beständig lagring: okänt (webbläsaren svarar inte på frågan)");
  if (info.backend && info.backend !== "idb")
    bits.push("⚠ rundorna ligger bara i minnet — IndexedDB nekades, de försvinner när appen stängs");
  return `<p class="storage">${bits.map(esc).join(" · ")}</p>`;
}

/* Kortet överst i rundlistan som leder till trenden (A5, §10 "nås från ett
   kort överst i rundlistan"). Kräver inga rundor räknade i förväg — trendvyn
   själv säger "du har N" om det är för få. */
function trendCardHtml(spelade) {
  return `<a class="card trendcard" href="./analys.html?trend=1">
    <div class="tt"><h2>Trend</h2><span class="arrow">›</span></div>
    <p class="sub">Score mot par, GIR, fairway, puttar och SG putt över dina rundor
      ${spelade ? `(${spelade} ${spelade === 1 ? "runda" : "rundor"})` : ""}</p>
  </a>`;
}

async function renderList() {
  const app = document.getElementById("app");
  const rows = AnalysLista.sortRows(await Store.list({ limit: 100 }));
  if (!rows.length) {
    app.innerHTML = `<h1>Analys</h1><p class="sub">Efter rundan</p>${emptyView()}`;
    return;
  }
  // Aktiva rundans LEVANDE dokument kan ha nyare siffror än indexraden hunnit
  // få (flush är async). Räkna om just den raden ur minnet.
  const live = Store.active();
  const merged = rows.map(r => (live && r.id === live.id ? Store.summary(live) : r));

  const paint = info => {
    const models = merged.map(r => AnalysLista.rowModel(r, {
      now: new Date().toISOString(),
      par: info ? (info[r.courseSlug + "|" + r.roundSeq + "|" + (r.courseName || "")] || {}).par : null,
      seqLength: info ? (info[r.courseSlug + "|" + r.roundSeq + "|" + (r.courseName || "")] || {}).seqLength : 0,
    }));
    const spelade = models.filter(m => !m.empty).length;
    app.innerHTML = `<h1>Analys</h1>
      <p class="sub">${spelade} ${spelade === 1 ? "runda" : "rundor"} i telefonen · tryck för analys</p>
      ${trendCardHtml(spelade)}
      ${models.map(rowHtml).join("")}
      <p class="note">SG per kategori kommer i en senare etapp — listan och
        trenden ovan räknas helt i telefonen.</p>
      <div id="storage"></div>`;
    storageHtml().then(h => {
      const el = document.getElementById("storage");
      if (el) el.innerHTML = h;
    });
  };
  paint(null);

  // …och fyll i ±par när banornas par-summor finns (SW-cachade, oftast direkt).
  const keys = {};
  for (const r of merged) keys[r.courseSlug + "|" + r.roundSeq + "|" + (r.courseName || "")] = r;
  const info = {};
  await Promise.all(Object.keys(keys).map(async k => {
    try {
      const b = await bandsFor(keys[k].courseSlug, keys[k].roundSeq, keys[k].courseName);
      info[k] = { par: b.par, seqLength: b.seqLength };
    } catch (e) { info[k] = { par: null, seqLength: 0 }; }
  }));
  if (roundIdFromUrl()) return;                 // användaren hann navigera bort
  if (Object.values(info).some(v => v.par != null)) paint(info);
}

/* ================= vy 2: analysen av EN runda ================= */

async function renderDetail(id) {
  const app = document.getElementById("app");
  // Den aktiva rundan läses ur minnet (färskast); övriga ur IndexedDB.
  const live = Store.active();
  const S = live && live.id === id ? live : await Store.get(id);
  if (!S) {
    app.innerHTML = `<a class="back" href="./analys.html">← Rundor</a>
      <div class="card empty"><p class="big">Rundan finns inte</p>
      <p class="txt">Den kan ha raderats på den här telefonen.</p>
      <a class="btn" href="./analys.html">Till rundlistan</a></div>`;
    return;
  }

  const B = await bandsFor(S.courseSlug, S.roundSeq, S.courseName);
  await loadBaseline();          // SG-baslinjen; misslyckas den visas inget SG
  const LOOP_SHORT = B.tables.LOOP_SHORT;

  // Iterera rundans EGNA hål — de bär sitt frysta globala hålnummer (§9.1.3).
  // Att gå via en runda-sekvens vore att läsa rundan med appens nuvarande
  // inställning i stället för med rundans egen.
  const results = [];
  const trows = [];
  for (const h of (S.holes || []).slice().sort((a, b) => a.n - b.n)) {
    const band = B.byGlobal[h.global];
    const res = AnalysCore.holeAnalysis(h, band);
    results.push(res);
    if (!res.played) continue;
    const par = res.par, d = par != null ? res.score - par : null;
    const diffCell = d == null ? `<td class="dimc">–</td>`
      : d === 0 ? `<td>E</td>` : `<td class="${d < 0 ? "under" : "over"}">${fmtDiff(d)}</td>`;
    const gir = res.girKnown ? (res.gir ? `<span class="gy">●</span>` : `<span class="gn">○</span>`) : "–";
    trows.push(`<tr><td>${h.n}${band ? ` <span style="color:var(--dim);font-size:12px">${esc(LOOP_SHORT[band.loop] || "")} ${band.hole}</span>` : ""}</td>
      <td>${par != null ? par : "–"}</td><td>${res.score}</td>
      <td${res.putts ? "" : ' class="dimc"'}>${res.putts || "–"}</td>
      <td>${gir}</td>${diffCell}</tr>`);
  }
  const A = AnalysCore.aggregate(results);
  const rad = Store.summary(S);
  const lvl = AnalysLista.levelInfo(rad.loggingLevel);

  const head = `<a class="back" href="./analys.html">← Rundor</a>
    <h1>${esc(AnalysLista.dateLabel(S.startedAt, new Date().toISOString()))}${S.status === "active" ? " · pågår" : ""}</h1>`;
  const sub = [S.player ? esc(S.player) : null, esc(S.courseName || ""),
               S.roundSeq ? "runda " + esc(S.roundSeq) : null,
               S.tee ? "tee " + esc(S.tee) : null].filter(Boolean).join(" · ");

  if (!A.nPlayed) {
    app.innerHTML = `${head}<p class="sub">${sub}</p>
      <div class="card empty"><p class="big">Inget loggat på den här rundan</p>
      <p class="txt">Rundan startades men inget hål har score än.</p></div>
      ${deleteHtml(S)}`;
    wireDelete(S);
    return;
  }

  const note = A.precExcluded
    ? `<p class="note">Green- och utslagsprecision räknas på hål utan plikt eller manuell justering — ${A.precExcluded} hål uteslutna.</p>`
    : "";
  // Ärlig täckning (APPSTORE_PLAN §5 regel 2, §9.2.3): säg rakt ut hur många av
  // de spelade hålen som har fullt underlag, i stället för att låta måtten se
  // heltäckande ut. Räknas ur samma indexrad som listvyn använder.
  const täckning = !rad.holesPlayed ? "" :
    `<p class="note">Loggning: ${esc(lvl.long)}` +
    (rad.holesLevel3 < rad.holesPlayed
      ? ` — fullt underlag på ${rad.holesLevel3} av ${rad.holesPlayed} spelade hål. Måtten nedan räknas bara på hålen som har data.`
      : ` — fullt underlag på alla ${rad.holesPlayed} spelade hål.`) + `</p>`;
  // Molnstatus i klartext (MOLN_PLAN §7). Listan har en badge med hovertext;
  // här finns plats för hela meningen, och det är här man landar när man
  // undrar om en gammal runda överlever ett telefonbyte. "Säkrad" nämns kort
  // och lågmält — det normala tillståndet ska inte ta plats från analysen.
  const molnRad = (() => {
    const s = AnalysLista.molnStatus(rad);
    if (!s) return "";
    return `<p class="note">${esc(molnTitel(s))}</p>`;
  })();
  // Bandatan kan saknas offline för en bana man inte har nedladdad — säg det
  // i stället för att visa par-lösa mått utan förklaring.
  const banvarning = B.hasData ? "" :
    `<p class="note">Bandatan för ${esc(S.courseName || "banan")} kunde inte läsas, så par,
      GIR och greenprecision saknas här. Öppna banan en gång med nät, sedan
      finns den offline.</p>`;

  app.innerHTML = `${head}
    <p class="sub">${sub} · ${A.nPlayed} hål</p>
    ${banvarning}
    ${täckning}
    ${molnRad}
    ${heroHtml(A)}
    ${kartHtml(S)}
    ${greenMapHtml(A, S)}
    ${fairwayHtml(A, S)}
    ${puttHtml(A, puttSGForRound(S, B.byGlobal))}
    ${distHtml(A)}
    ${parHtml(A)}
    ${tableHtml(trows.join(""), A)}
    ${note}
    ${deleteHtml(S)}`;
  wireDelete(S);
}

/* Radera EN runda. Bara avslutade rundor — den pågående ägs av logg-vyn och
   ska avslutas där först (annars rycks den undan mitt i ett hål). */
function deleteHtml(S) {
  if (S.status === "active") return "";
  return `<div class="card"><button class="danger-btn" id="del">Radera den här rundan</button>
    <p class="foot">Går inte att ångra. Rundan finns bara i den här telefonen.</p></div>`;
}
function wireDelete(S) {
  const b = document.getElementById("del");
  if (!b) return;
  b.onclick = () => {
    const när = AnalysLista.dateLabel(S.startedAt, new Date().toISOString());
    if (!confirm(`Radera rundan ${när} på ${S.courseName || "banan"}? Det går inte att ångra.`)) return;
    Store.remove(S.id).then(() => { location.href = "./analys.html"; });
  };
}

/* ================= vy 3: trend över rundhistoriken (A5) =================
   Datavägen (§10, bindande): rundlistan läser bara indexrader (§9.1.5), men
   trenden behöver mer (GIR, fairway, puttar, SG putt) — mått som kräver att
   hela runddokumentet öppnas och räknas om. Lösningen: en härledd rundsam-
   manfattning cachas i Store (`trendSummaries`, mobile/store.js) första
   gången varje runda öppnas här, och läses därefter. Cachen bär `v`
   (AnalysTrend.CACHE_VERSION) — matchar den inte räknas raden om, så en gammal
   siffra aldrig lever vidare osynligt efter att måtten ändrats. */

/* Sammanfattningen för EN runda — ur cachen om giltig, annars räknad ur hela
   dokumentet och skriven till cachen. `row` = en indexrad (Store.list()). */
async function trendSummaryFor(row) {
  try {
    const cached = await Store.trendSummary(row.id);
    if (cached && cached.v === AnalysTrend.CACHE_VERSION) return cached;
  } catch (e) { /* cache-miss är inte ett fel — räkna om */ }
  const live = Store.active();
  const S = (live && live.id === row.id) ? live : await Store.get(row.id);
  if (!S) return null;
  const B = await bandsFor(S.courseSlug, S.roundSeq, S.courseName);
  await loadBaseline();
  const results = (S.holes || []).slice().sort((a, b) => a.n - b.n)
    .map(h => AnalysCore.holeAnalysis(h, B.byGlobal[h.global]));
  const A = AnalysCore.aggregate(results);
  const sg = puttSGForRound(S, B.byGlobal);
  const summary = AnalysTrend.summaryFromAggregate(
    { id: S.id, startedAt: S.startedAt, courseName: S.courseName, roundSeq: S.roundSeq },
    A, sg);
  Store.setTrendSummary(summary).catch(() => {});
  return summary;
}

/* score-mot-par: heltal på varje punkt, decimal bara på det rullande snittet
   (som är ett medelvärde av heltal och därför oftast inte blir jämnt). */
function fmtToParTrend(v) {
  const r = Math.round(v * 10) / 10;
  if (Math.abs(r) < 0.05) return "E";
  return (r > 0 ? "+" : "") + (Number.isInteger(r) ? r : r.toFixed(1));
}

/* Sparkline: punkter + (om serien har nog rundor) ett rullande snitt som linje.
   Samma inline-SVG-språk som greenMapHtml (ingen Chart.js, se A9-kommentaren
   ovan) — vyn förblir offline och lätt. En serie under AnalysTrend.MIN_ROUNDS
   ritar INGEN linje (§10: en linje mellan under tre punkter är ett falskt
   besked) — bara punkterna, plus en rad som säger hur få de är. */
function sparklineSvg(points, opts) {
  const o = opts || {};
  const fmt = o.fmt || (v => String(v));
  const drawLine = !!o.drawLine;
  const W = 280, H = 108, PAD = 16;
  const n = points.length;
  const vals = points.map(p => p.value);
  if (drawLine) for (const p of points) if (p.rollingAvg != null) vals.push(p.rollingAvg);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  if (lo === hi) { lo -= 1; hi += 1; }
  const xAt = i => (n <= 1 ? W / 2 : PAD + i * (W - 2 * PAD) / (n - 1));
  const yAt = v => H - PAD - (v - lo) / (hi - lo) * (H - 2 * PAD);
  const zeroY = (lo < 0 && hi > 0)
    ? `<line x1="${PAD}" y1="${yAt(0).toFixed(1)}" x2="${W - PAD}" y2="${yAt(0).toFixed(1)}" stroke="#1a4536" stroke-width="1"/>`
    : "";
  let lineEl = "";
  if (drawLine) {
    const seg = points.map((p, i) => (p.rollingAvg == null ? null
      : `${xAt(i).toFixed(1)},${yAt(p.rollingAvg).toFixed(1)}`)).filter(Boolean).join(" ");
    lineEl = `<polyline points="${seg}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  }
  const dots = points.map((p, i) => {
    const när = AnalysLista.dateLabel(p.startedAt, new Date().toISOString());
    const titel = esc(`${när}${p.courseName ? " · " + p.courseName : ""} · ${fmt(p.value)}`);
    return `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.value).toFixed(1)}" r="3.4"
      fill="var(--good)"><title>${titel}</title></circle>`;
  }).join("");
  return `<svg class="tchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend, ${n} rundor">
    ${zeroY}${lineEl}${dots}
  </svg>`;
}

/* Ett kort per serie. `series` = { points, n, enough } från AnalysTrend.buildSeries.
   `n` visas ALLTID (§10:s regel som gäller alla V2-etapperna): ett mått som
   räknas på färre rundor än det ser ut att göra ska säga det — bäst synligt just
   här, där score-serien (bara EN rundlängd) typiskt vilar på färre rundor än
   GIR/fairway/puttar/SG putt (som tål blandade rundlängder). */
function seriesCardHtml(title, series, opts) {
  const o = opts || {};
  const fmt = o.fmt || (v => String(v));
  if (!series.n) {
    return `<div class="card tcard"><h2>${esc(title)}</h2>
      <p class="tempty">Inga rundor med det här måttet än.</p></div>`;
  }
  const chart = sparklineSvg(series.points, { fmt, drawLine: series.enough });
  const senaste = series.points[series.points.length - 1];
  const linjeNot = series.enough ? "" :
    `<p class="tempty">För få rundor för en linje — ${series.n} av ${AnalysTrend.MIN_ROUNDS} som krävs.</p>`;
  return `<div class="card tcard">
    <h2>${esc(title)} <span class="n">${series.n} runda${series.n === 1 ? "" : "r"}${esc(o.extra || "")}</span></h2>
    ${chart}
    <p class="foot">Senast: ${fmt(senaste.value)}${
      series.enough ? ` · rullande snitt: ${fmt(senaste.rollingAvg)}` : ""}</p>
    ${linjeNot}
  </div>`;
}

async function renderTrend() {
  const app = document.getElementById("app");
  const head = `<a class="back" href="./analys.html">← Rundor</a><h1>Trend</h1>`;
  app.innerHTML = `${head}<p class="sub">Räknar rundorna …</p>`;

  // Bara AVSLUTADE rundor med minst ett spelat hål — en pågående rundas siffror
  // är inte färdiga än, och en tom runda har inget att bidra med.
  const rows = (await Store.list({ limit: 200 })).filter(r => r.status === "finished" && r.holesPlayed);
  const summaries = (await Promise.all(rows.map(r => trendSummaryFor(r).catch(() => null)))).filter(Boolean);
  const T = AnalysTrend.buildSeries(summaries);

  if (!T.ready) {
    app.innerHTML = `${head}
      <div class="card empty">
        <p class="big">Trend visas när tre rundor är loggade — du har ${T.total}</p>
        <p class="txt">Logga fler rundor så visas score mot par, GIR, fairway,
          puttar och SG putt över tid.</p>
        <a class="btn" href="./analys.html">Till rundlistan</a>
      </div>`;
    return;
  }

  const scoreExtra = T.group ? ` · ${T.group}-hålsrundor` : "";
  app.innerHTML = `${head}
    <p class="sub">${T.total} rundor i telefonen</p>
    ${seriesCardHtml("Score mot par", T.series.scoreToPar, { fmt: fmtToParTrend, extra: scoreExtra })}
    ${seriesCardHtml("GIR", T.series.gir, { fmt: v => Math.round(v) + "%" })}
    ${seriesCardHtml("Fairway", T.series.fairway, { fmt: v => Math.round(v) + "%" })}
    ${seriesCardHtml("Puttar per hål", T.series.puttsPerHole, { fmt: v => v.toFixed(2) })}
    ${seriesCardHtml("SG putt", T.series.sgPutt, { fmt: v => (v > 0 ? "+" : "") + v.toFixed(2) })}
  `;
}

function render() {
  if (trendRequested()) return renderTrend();
  const id = roundIdFromUrl();
  return id ? renderDetail(id) : renderList();
}
Store.ready().then(render);
window.addEventListener("pageshow", () => Store.ready().then(render));
</script>
<script>
/* Håll navigeringen inne i hemskärms-appen (iOS standalone). */
(function () {
  var standalone = ("standalone" in navigator && navigator.standalone)
    || matchMedia("(display-mode: standalone)").matches;
  if (!standalone) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var url = new URL(a.getAttribute("href"), location.href);
    if (url.origin !== location.origin) return;
    e.preventDefault();
    location.href = url.href;
  });
})();
</script>
