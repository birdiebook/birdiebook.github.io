name: Deploy till Cloudflare

# DEN RIKTIGA MÅLLINJEN. Push till `main` = ny kod på
# https://birdiebook.johlsson-j.workers.dev = ny kod i TestFlight-appen.
#
# Innan den här filen fanns deployades appen för hand från en dator, medan
# GitHub Pages deployade automatiskt till en FRUSEN kopia. Följden var att den
# gröna bocken i Actions-fliken pekade på fel värd: man mergade, såg grönt och
# trodde att telefonen fått ny kod. Nu finns det ett enda sätt att deploya, och
# det syns här.
#
# KRÄVER TVÅ HEMLIGHETER (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    Skapa på dash.cloudflare.com → My Profile → API
#                           Tokens. Mallen "Edit Cloudflare Workers" räcker;
#                           den behöver Workers Scripts:Edit och R2:Edit för
#                           rundhinken som Workern binder.
#   CLOUDFLARE_ACCOUNT_ID   Står i URL:en på Cloudflare-dashboarden, och i
#                           sidopanelen under Workers & Pages. Behövs eftersom
#                           `wrangler.jsonc` medvetet inte har någon
#                           `account_id` — den hör inte hemma i git.
#
# Saknas någon av dem FALLERAR jobbet med flit i stället för att hoppas över.
# Ett grönt jobb som inte deployade är precis den lögn den här filen finns för
# att ta bort.

on:
  push:
    branches: [main]
  workflow_dispatch:

# En deploy i taget. Två snabba pushar ska inte kunna kapplöpa om vem som
# skriver sist till produktionen; den senare vinner och den tidigare avbryts.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2        # behövs för version.js-kontrollen nedan

      - name: Hemligheterna finns?
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          saknas=""
          [ -z "$TOKEN" ]   && saknas="$saknas CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && saknas="$saknas CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$saknas" ]; then
            echo "::error::Saknar hemlighet(er):$saknas — lägg dem under Settings → Secrets and variables → Actions. Se kommentaren överst i .github/workflows/deploy.yml."
            exit 1
          fi

      # Servicearbetaren serverar app-skalet CACHE-FIRST och bygger sitt
      # cache-namn av SG_APP_VERSION. Deployar man ändrad frontend utan att
      # bumpa den fortsätter telefonen visa gammal kod — deployen är grön,
      # filerna ligger på servern, och ingenting syns. Det felet är osynligt
      # och dyrt, så det ska stoppas här och inte upptäckas på banan.
      #
      # KONTROLLEN SER BARA SISTA COMMITEN (HEAD~1..HEAD) — repot är 700 MB
      # kartrutor, så full historik i varje deploy vore dyrt. För en merge är
      # det ändå hela grenen, eftersom HEAD~1 då är förra main-tippen. Men en
      # push med flera commits där bumpen ligger i en tidigare av dem faller ut
      # som ett FALSKT STOPP. Det är den ofarliga riktningen — ingen odeployad
      # bump slinker förbi, du får bara ett rött jobb — och det är precis vad
      # regeln i CLAUDE.md säger: bumpa i SISTA commiten. Fastnar du ändå:
      # lägg bumpen sist, eller skriv [no-bump].
      - name: version.js bumpad?
        run: |
          appfiler=$(git diff --name-only HEAD~1 HEAD -- '*.js' '*.html' '*.css' 'manifest.json' \
                     | grep -v '^version.js$' || true)
          if [ -z "$appfiler" ]; then
            echo "Inga frontendfiler ändrade — ingen bump behövs."
            exit 0
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^version.js$'; then
            echo "version.js är bumpad. Bra."
            exit 0
          fi
          # Nödutgång för ändringar som inte kan påverka vad telefonen kör —
          # en kommentar, en omformatering. Skriv [no-bump] i commit-meddelandet
          # och ta ansvaret medvetet. Den finns för att en falsk stopp ska kosta
          # tio sekunder, inte för att regeln ska gå att slentriankringgå.
          if git log -1 --pretty=%B | grep -qF '[no-bump]'; then
            echo "::warning::Frontend ändrad utan bump, men commiten säger [no-bump]. Släpper igenom."
            exit 0
          fi
          echo "::error::Frontend ändrad utan att version.js bumpades. Servicearbetaren bygger SHELL_CACHE av SG_APP_VERSION — utan bump serverar telefonen gammal kod cache-first och deployen syns inte. Bumpa version.js, eller skriv [no-bump] i commit-meddelandet om ändringen omöjligt kan nå telefonen. Ändrade filer:"
          echo "$appfiler"
          exit 1

      - name: Deploya
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Pinnad till major 4 (senaste vid pinningen: 4.124.0), som är den som
        # gäller mot `compatibility_date` 2026-08-05 i wrangler.jsonc. Patchar
        # och minors släpps igenom; en ny major tas medvetet.
        #
        # Skälet att inte lämna den öppen: en ny major kan ändra hur `assets`
        # och `.assetsignore` tolkas, och det felet syns inte i loggen utan som
        # en trasig app på telefonen. En deploy som byter verktygsversion av sig
        # själv är inte en deploy man kan lita på.
        run: npx --yes wrangler@4 deploy

      - name: Vad ligger uppe nu
        run: |
          echo "### Deployad" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "- version: \`$(grep -o '"[^"]*"' version.js | head -1 | tr -d '\"')\`" >> $GITHUB_STEP_SUMMARY
          echo "- värd: https://birdiebook.johlsson-j.workers.dev" >> $GITHUB_STEP_SUMMARY
