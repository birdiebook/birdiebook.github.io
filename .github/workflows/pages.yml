name: Pages (frusen värd — manuell)

# GITHUB PAGES ÄR INTE APPENS VÄRD. Appen bor på Cloudflare sedan MOLN_PLAN §6
# V0, och det är den enda värd som räknas:
#
#     https://birdiebook.johlsson-j.workers.dev
#
# Pages-kopian på birdiebook.github.io finns kvar av ETT skäl: telefoner som har
# den gamla URL:en på hemskärmen ska mötas av flyttbannern i `boot.js`. Den
# bannern gör mer än att informera — den avregistrerar servicearbetaren och
# raderar cacherna, så att den gamla appen inte lever vidare offline med en
# runda som aldrig kan laddas upp (Workern är same-origin och har medvetet ingen
# CORS-lista).
#
# PUSH-TRIGGERN ÄR BORTTAGEN 2026-08-17, och det är hela poängen med den här
# filen. Förut deployade den vid varje push till `main`, och då såg en grön
# bock ut som "det är live i appen". Det var det aldrig: en ändring når
# TestFlight först när CLOUDFLARE-workern deployas. Den gröna bocken pekade på
# en värd vars enda innehåll är en banner som säger "gå någon annanstans".
#
# Kör den alltså BARA manuellt, och bara när själva bannern behöver uppdateras
# (t.ex. om `MAL` i boot.js byter adress). Vill du att den frusna kopian ska
# sluta finnas helt räcker det inte att ta bort den här filen — Pages måste
# stängas av i Settings → Pages, annars ligger den senaste deployen kvar.
#
# KRÄVER (om den körs): Settings → Pages → Build and deployment →
# Source = "GitHub Actions" (inte "Deploy from a branch").

on:
  workflow_dispatch:   # ENDAST manuellt — se förklaringen ovan

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
