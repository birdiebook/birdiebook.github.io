<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c2e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Profil">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="./boot.js"></script>
<title>SG Profil</title>
<style>
  :root { --bg:#0c2e22; --card:#123c2d; --ink:#e8f5ec; --dim:#9fc4ae;
          --line:#1f5540; --accent:#37b06b; --accent-ink:#06180f;
          --warn:#e8c34a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { max-width:480px; margin:0 auto; padding:12px 14px 96px; }
  h1 { font-size:22px; margin:10px 0 2px; }
  h2 { font-size:15px; margin:8px 0 10px; }
  .sub { color:var(--dim); font-size:14px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:12px 14px; margin:10px 0; }
  .hint { color:var(--dim); font-size:13px; line-height:1.45; margin:8px 0 0; }
  .back { display:inline-block; color:var(--dim); text-decoration:none;
    font-size:14px; margin-bottom:4px; }

  /* Stegvisaren. Tre prickar, inte en procentsats: guiden ska kannas kort. */
  .steg { display:flex; gap:6px; align-items:center; margin:6px 0 14px; }
  .steg i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .steg i.on { background:var(--accent); }
  .stegtxt { color:var(--dim); font-size:12px; margin:0 0 12px; }

  /* HINKKNAPPAR — hela Enkel-lagets inmatning. Inga falt, inga reglage:
     en spelare som ombeds skriva in ett tal hoppar av, och talet hen anda
     skriver ar pahittat (UPPGRADERING_3D §GP1). Minst 44 px hoga. */
  .fraga { margin:0 0 18px; }
  .fraga > h3 { font-size:15px; margin:0 0 2px; font-weight:700; }
  .fraga > p { color:var(--dim); font-size:12.5px; margin:0 0 9px; line-height:1.4; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { appearance:none; border:1px solid var(--line); background:#0e3326;
    color:var(--ink); font:600 14px inherit; padding:11px 14px; border-radius:11px;
    min-height:44px; cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
    font-weight:800; }
  /* Utvagen ser annorlunda ut an ett svar - men den ar INTE nedtonad till
     osynlighet: den ska vara lika latt att trycka pa som resten (§GP1). */
  .chip.utvag { border-style:dashed; color:var(--dim); }
  .chip.utvag.on { color:var(--accent-ink); border-style:solid; }

  .knappar { display:flex; gap:10px; margin-top:6px; }
  .btn { flex:1; appearance:none; border:0; border-radius:12px; min-height:48px;
    background:var(--accent); color:var(--accent-ink); font:800 15px inherit; cursor:pointer; }
  .btn.ghost { background:none; border:1px solid var(--line); color:var(--dim);
    font-weight:600; }

  /* Sammanfattningen: en rad per fraga, hela raden ar tryckbar. */
  .rad { display:flex; justify-content:space-between; align-items:center; gap:10px;
    width:100%; appearance:none; background:none; border:0; border-bottom:1px solid var(--line);
    color:var(--ink); font:inherit; text-align:left; padding:11px 0; min-height:48px;
    cursor:pointer; }
  .rad:last-of-type { border-bottom:0; }
  .rad .fr { color:var(--dim); font-size:13px; }
  .rad .sv { font-weight:700; font-size:14.5px; text-align:right; }
  .rad .sv.tom { color:var(--warn); font-weight:600; }

  /* Avancerad: enda stallet med tangentbord, och den ar hopfalld. */
  details.avancerad summary { cursor:pointer; color:var(--dim); font-size:13.5px;
    padding:8px 0; list-style:none; }
  details.avancerad summary::-webkit-details-marker { display:none; }
  details.avancerad summary::before { content:"▸ "; }
  details.avancerad[open] summary::before { content:"▾ "; }
  .falt { display:flex; gap:10px; margin-top:8px; }
  .falt input, .falt select { flex:1; min-height:44px; background:#0e3326; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:0 11px; font:600 15px inherit; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:1200; display:flex; gap:4px;
    background:var(--card); border-top:1px solid var(--line);
    padding:6px 8px calc(env(safe-area-inset-bottom) + 6px); }
  .tabs a { flex:1; text-align:center; text-decoration:none; color:var(--dim);
    font-size:11px; font-weight:600; padding:5px 0 3px; border-radius:10px; }
  .tabs a .ico { display:block; font-size:20px; }
  .tabs a.active { color:var(--ink); background:#1a4c38; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs">
  <a href="./index.html"><span class="ico">⛳</span>Logga slag</a>
  <a href="./karta.html"><span class="ico">🗺</span>Karta</a>
  <a href="./oversikt.html"><span class="ico">📋</span>Översikt</a>
  <a href="./analys.html"><span class="ico">📊</span>Analys</a>
  <a href="./profil.html" class="active"><span class="ico">👤</span>Profil</a>
</nav>
<script src="./round.js"></script>
<script src="./score.js"></script>
<script src="./spelprofil.js"></script>
<script src="./store.js"></script>
<script>
/* profil.html — spelprofilens guide och översikt (UPPGRADERING_3D §GP1 del 2).
 *
 * DEN BÄRANDE REGELN: `Enkel` har inget tangentbord. Sju frågor, alla besvarade
 * med knappar, och varje fråga har en UTVÄG som är lika lätt att trycka på som
 * svaren. Det är inte en bekvämlighet — planen säger rakt ut att en spelare som
 * ombeds skriva in "min driverspridning i meter" hoppar av, och att siffran hen
 * ändå skriver är påhittad. Det enda fältet på sidan ligger under `Avancerad`,
 * hopfällt, och är frivilligt.
 *
 * Sidan äger INGEN data. Hinkarna bor i `spelprofil.js` (ren modul), lagringen i
 * `store.js`. Den här filen är DOM: den ritar listor ur `Spelprofil.HCP` och
 * vännerna, och skriver via `Store.setProfile`. Lägg aldrig ett alternativ här —
 * då finns det på ett ställe till än det som spridningsmodellen läser.
 *
 * Varje tryck sparar direkt. Ingen "Spara"-knapp, ingen halvfärdig kopia i
 * minnet: en guide som kan avbrytas mitt i (telefonen dör, någon ropar från
 * teen) ska ha behållit det som redan var besvarat.  */
"use strict";

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const komma = v => String(v).replace(".", ",");

/* Frågorna i EN tabell — steg, nyckel, rubrik, varför, alternativlista och
   vilket id som är utvägen. Guiden och sammanfattningen läser samma tabell, så
   de inte kan komma att visa olika frågor. */
const FRAGOR = [
  { steg: 1, key: "hcpBucket", rubrik: "Ditt handicap",
    varfor: "Väljer grundspridningen — hur brett dina slag hamnar.",
    lista: () => Spelprofil.HCP, utvag: "vet-inte" },
  { steg: 1, key: "driver", rubrik: "Hur långt slår du driver?",
    varfor: "Din vanliga längd, inte din bästa.",
    lista: () => Spelprofil.DRIVER, utvag: "ingen-driver" },
  { steg: 1, key: "jarn7", rubrik: "Hur långt slår du 7-järn?",
    varfor: "Ankaret för resten av klubbtrappan.",
    lista: () => Spelprofil.JARN7, utvag: "vet-inte" },
  { steg: 2, key: "miss", rubrik: "Din vanliga miss",
    varfor: "Åt vilket håll planen ska lämna marginal.",
    lista: () => Spelprofil.MISS, utvag: "ojamn" },
  { steg: 2, key: "svaghet", rubrik: "Din största svaghet",
    varfor: "Var planen får ta risk — och var den inte får det.",
    lista: () => Spelprofil.SVAGHET, utvag: null },
  { steg: 3, key: "stil", rubrik: "Hur vill du spela?",
    varfor: "Säker minimerar de stora hålen, aggressiv jagar birdies. " +
            "Balanserad är lägst förväntad score.",
    lista: () => Spelprofil.STIL, utvag: null },
  { steg: 3, key: "tee", rubrik: "Vilken tee spelar du oftast?",
    varfor: "Vilken faktisk tee det blir slås upp per bana.",
    lista: () => Spelprofil.TEE, utvag: null },
];
const STEG_NAMN = { 1: "Din nivå", 2: "Dina missar", 3: "Din rundplan" };
const ANTAL_STEG = 3;

/* Vy: null = sammanfattning, 1–3 = guidens steg. Nya spelare möts av guiden;
   den som redan svarat något möts av sina svar. */
let steg = null;
const label = (key, id) => {
  const f = FRAGOR.find(x => x.key === key);
  const rad = f && f.lista().find(o => o.id === id);
  return rad ? rad.label : null;
};

/* ---------- guiden ---------- */
function fragaHtml(f, profil) {
  const valt = profil[f.key];
  const knappar = f.lista().map(o => {
    const pa = valt === o.id;
    const ut = f.utvag && o.id === f.utvag ? " utvag" : "";
    return `<button class="chip${ut}${pa ? " on" : ""}" data-key="${esc(f.key)}"
      data-val="${esc(o.id)}" aria-pressed="${pa}">${esc(o.label)}</button>`;
  }).join("");
  return `<div class="fraga"><h3>${esc(f.rubrik)}</h3>
    <p>${esc(f.varfor)}</p><div class="chips">${knappar}</div></div>`;
}

function guideHtml(profil) {
  const fragor = FRAGOR.filter(f => f.steg === steg).map(f => fragaHtml(f, profil)).join("");
  const prickar = [1, 2, 3].map(i => `<i class="${i <= steg ? "on" : ""}"></i>`).join("");
  const sist = steg === ANTAL_STEG;
  return `<h1>${esc(STEG_NAMN[steg])}</h1>
    <div class="steg">${prickar}</div>
    <p class="stegtxt">Steg ${steg} av ${ANTAL_STEG} · varje fråga går att hoppa över</p>
    <div class="card">${fragor}</div>
    <div class="knappar">
      <button class="btn ghost" id="bak">${steg === 1 ? "Avbryt" : "Tillbaka"}</button>
      <button class="btn" id="fram">${sist ? "Klar" : "Nästa"}</button>
    </div>
    <p class="hint">Svaren sparas direkt. Du kan ändra dem när som helst.</p>`;
}

/* ---------- sammanfattningen ---------- */
function sammanfattningHtml(profil) {
  const rader = FRAGOR.map(f => {
    const sv = label(f.key, profil[f.key]);
    return `<button class="rad" data-steg="${f.steg}">
      <span class="fr">${esc(f.rubrik)}</span>
      <span class="sv${sv ? "" : " tom"}">${sv ? esc(sv) : "inte besvarad"}</span>
    </button>`;
  }).join("");

  // Handicapet är det enda talet som lämnar profilen till en UTRÄKNING, så det
  // är också det enda som kan ljuga tyst. Källan står bredvid.
  const h = Store.hcpForBerakning();
  const hcpRad = h.kalla === "exakt"
    ? `Netto räknas på <b>${komma(h.value)}</b> — ditt inmatade index.`
    : h.kalla === "hink"
      ? `Netto räknas på <b>${komma(h.value)}</b>, mitten av din hink. Det är en
         uppskattning, inte ditt index — fyll i det exakta talet under Avancerad
         om du vet det.`
      : "Utan handicap går netto i spelformerna inte att räkna.";

  const kon = profil.kon || "";
  return `<h1>Profil</h1>
    <p class="sub">Den här bär din spridning: hur planen räknar, och vad
      spelformerna räknar netto på.</p>
    <div class="card">${rader}</div>
    <p class="hint">${hcpRad}</p>
    <div class="card">
      <details class="avancerad"${profil.hcpExact != null || kon ? " open" : ""}>
        <summary>Avancerat — frivilligt</summary>
        <p class="hint" style="margin-top:2px">Exakt handicap-index används av
          spelformerna i stället för hinkens mitt. Kön behövs för att slå upp
          course rating och slope, som är per tee OCH kön.</p>
        <div class="falt">
          <!-- type=text, inte number: ett number-fält slänger "8,7" tyst (value
               blir tom sträng) och svenskt tangentbord ger komma. Uppmätt
               2026-08-01, se §GP1 del 1. -->
          <input id="hcpExact" type="text" inputmode="decimal" placeholder="hcp-index"
            value="${profil.hcpExact != null ? esc(komma(profil.hcpExact)) : ""}">
          <select id="kon" style="flex:0 0 42%">
            <option value="">kön —</option>
            <option value="herr"${kon === "herr" ? " selected" : ""}>herr</option>
            <option value="dam"${kon === "dam" ? " selected" : ""}>dam</option>
          </select>
        </div>
      </details>
    </div>
    <div class="knappar">
      <button class="btn ghost" id="omguide">Gå igenom guiden igen</button>
    </div>`;
}

/* ---------- rendering ---------- */
function render() {
  const profil = Store.profile();
  if (!profil) {                       // spelprofil.js saknas — säg det, gissa inte
    app.innerHTML = `<h1>Profil</h1>
      <div class="card"><p class="hint">Profilmodulen kunde inte laddas.
      Ladda om sidan.</p></div>`;
    return;
  }
  app.innerHTML = steg ? guideHtml(profil) : sammanfattningHtml(profil);
  koppla(profil);
}

function koppla(profil) {
  /* Ett tryck = ett sparat svar. Trycker man på det redan valda tas svaret
     BORT: annars går en felaktig knapptryckning inte att ångra utan att svara
     något annat, och "inget svar" är ett giltigt läge i den här guiden. */
  app.querySelectorAll(".chip").forEach(b => {
    b.onclick = () => {
      const key = b.dataset.key, val = b.dataset.val;
      const nytt = profil[key] === val ? null : val;
      const patch = {};
      patch[key] = nytt;
      // Hinken och det exakta talet får inte börja säga olika om samma spelare:
      // byter man hcp-hink i guiden gäller inte längre ett gammalt exakt index.
      if (key === "hcpBucket" && profil.hcpExact != null &&
          Spelprofil.bucketForHcp(profil.hcpExact) !== nytt) patch.hcpExact = null;
      Store.setProfile(patch);
      render();
    };
  });

  const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e[ev] = fn; };
  on("fram", "onclick", () => { steg = steg < ANTAL_STEG ? steg + 1 : null; scrollTo(0, 0); render(); });
  on("bak", "onclick", () => { steg = steg > 1 ? steg - 1 : null; scrollTo(0, 0); render(); });
  on("omguide", "onclick", () => { steg = 1; scrollTo(0, 0); render(); });
  app.querySelectorAll(".rad").forEach(b => {
    b.onclick = () => { steg = +b.dataset.steg; scrollTo(0, 0); render(); };
  });

  on("hcpExact", "onchange", e => {
    const v = Spelprofil.hcpTal(e.target.value);
    Store.setProfile(v == null ? { hcpExact: null }
                               : { hcpExact: v, hcpBucket: Spelprofil.bucketForHcp(v) });
    render();
  });
  on("kon", "onchange", e => { Store.setProfile({ kon: e.target.value || null }); render(); });
}

Store.ready().then(() => {
  // Ny spelare möts av guiden, inte av en tom lista hen själv måste förstå att
  // hon ska fylla i. Har hen svarat något visas svaren.
  const p = Store.profile();
  steg = (p && Spelprofil.harSvar(p)) ? null : 1;
  render();
});
</script>
</body>
</html>
