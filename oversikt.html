<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c2e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Översikt">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="./boot.js"></script>
<title>SG Översikt</title>
<style>
  :root { --bg:#0c2e22; --card:#123c2d; --ink:#e8f5ec; --dim:#9fc4ae;
          --line:#1f5540; --accent:#37b06b; --accent-ink:#06180f;
          --warn:#e8c34a; --danger:#e26a5a; --good:#7ee2a8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #app { max-width:480px; margin:0 auto; padding:12px 14px 96px; }
  /* liggande mobil: låt kortet bli så brett som skärmen så hela scorekortet
     ryms utan horisontell scroll */
  @media (orientation:landscape) {
    #app { max-width:none; }
    .card-tbl th, .card-tbl td { padding:6px 3px; font-size:14px; }
    .card-tbl .name { min-width:80px; }
    .hcol { min-width:0; }
  }
  h1 { font-size:22px; margin:10px 0 2px; }
  h2 { font-size:15px; margin:8px 0 10px; }
  h2 .note { color:var(--dim); font-weight:400; font-size:12px; }
  .sub { color:var(--dim); font-size:14px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:10px 14px; margin:10px 0; }
  .hint { color:var(--dim); font-size:13px; text-align:center; margin-top:10px; }
  .hint.left { text-align:left; margin:4px 0; }
  /* tom/uppmanande vy när man inte är med i en match */
  .empty-cta { text-align:center; padding:26px 14px; }
  .empty-cta .ico { font-size:44px; display:block; margin-bottom:8px; }
  .empty-cta .big { font-size:16px; font-weight:700; margin:0 0 6px; }
  .empty-cta .txt { color:var(--dim); font-size:14px; line-height:1.4; margin:0 0 14px; }
  /* Knappen tillhör SIDAN, inte den tomma vyn. Regeln satt under .empty-cta,
     så Sällskaps-kortets <a class="btn"> föll tillbaka på webbläsarens blå
     understrukna länk mitt i den gröna designen. */
  a.btn { display:inline-block; text-decoration:none; background:var(--accent);
    color:var(--accent-ink); font-weight:800; font-size:15px; padding:11px 22px;
    border-radius:12px; }

  /* ---------- scorekort ---------- */
  /* horisontell scroll: spelarnamnet är sticky till vänster, hålen scrollar */
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:2px -4px; }
  table.card-tbl { border-collapse:separate; border-spacing:0; width:auto; min-width:100%; }
  .card-tbl th, .card-tbl td { padding:7px 4px; text-align:center; font-size:15px;
    white-space:nowrap; border-bottom:1px solid var(--line); }
  .card-tbl thead th { color:var(--dim); font-weight:600; font-size:13px; }
  /* sticky namn-kolumn */
  .card-tbl .name { position:sticky; left:0; z-index:2; text-align:left;
    background:var(--card); padding-left:2px; padding-right:10px; min-width:96px; }
  /* stående mobil: visa bara förnamnet så scorekortet får mer plats */
  .pn-first { display:none; }
  @media (orientation:portrait) {
    .pn-full { display:none; }
    .pn-first { display:inline; }
  }
  .card-tbl thead .name, .card-tbl .parrow .name { background:var(--card); }
  .card-tbl tbody tr.me .name { background:#1a4c38; }
  .card-tbl tbody tr.me td { background:#153f2f; }
  .me-tag { color:var(--dim); font-size:11px; font-weight:600; }
  .parrow td, .parrow th { color:var(--dim); font-size:13px; font-weight:600;
    border-bottom:2px solid var(--line); }
  .hcol { min-width:30px; }
  /* delsummor (Ut/In/Tot) — svag avgränsning så ögat hittar dem */
  .card-tbl .sumcol { min-width:34px; font-weight:800;
    border-left:1px solid var(--line); background:#0e3326; }
  .card-tbl tbody tr.me td.sumcol { background:#173d2d; }
  .totcol { min-width:40px; font-weight:800; }
  td.tot { font-weight:800; }
  td.tot.under { color:var(--good); }
  td.tot.over  { color:var(--danger); }
  td.empty { color:var(--dim); }
  /* score-form runt siffran (klassisk golf-notation) */
  .mk { display:inline-flex; align-items:center; justify-content:center;
        width:24px; height:24px; line-height:1; font-weight:700; }
  .mk.birdie { border:1.6px solid var(--ink); border-radius:50%; }
  .mk.eagle  { border:1.6px solid var(--ink); border-radius:50%;
               box-shadow:0 0 0 2px var(--card), 0 0 0 3.6px var(--ink); }
  .mk.bogey  { border:1.6px solid var(--ink); border-radius:3px; }
  .mk.dbl    { border:1.6px solid var(--ink); border-radius:3px;
               box-shadow:0 0 0 2px var(--card), 0 0 0 3.6px var(--ink); }
  /* extra luft i cellen så dubbelringarna får plats */
  .card-tbl tbody td.sc { padding:9px 6px; }

  /* gemensam flik-rad (samma på alla sidor) */
  /* Hemskärm: app-shell med FLIK-RADEN SOM FLEX-ELEMENT i botten (inte fixed).
     Fixed-element klipps vid layout-viewportens nederkant (797) på scrollande
     sidor; ett vanligt flödes-element i en helskärmshög body (100lvh = 844) sitter
     däremot garanterat längst ner utan klippning eller grön remsa. #app får flex:1
     och scrollar internt. Safari (ej standalone) behåller sin fixed-flikrad, orört. */
  @supports (height: 100lvh) {
    @media (display-mode: standalone) {
      body { height: 100lvh; display: flex; flex-direction: column;
             overflow: hidden; padding: 0; }
      #app { flex: 1 1 auto; min-height: 0; overflow-y: auto;
             -webkit-overflow-scrolling: touch;
             padding: calc(env(safe-area-inset-top) + 12px)
                      calc(env(safe-area-inset-right) + 14px) 16px
                      calc(env(safe-area-inset-left) + 14px); }
      .tabs { position: static; padding: 6px 10px 8px; }
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script src="./nav.js"></script>
<script src="./round.js"></script>
<!-- Live-scoring: samma tre script som Logga slag. Ger leaderboard-modellen. -->
<script src="./vendor/supabase-js.js"></script>
<script src="./score.js"></script>
<script src="./spelprofil.js"></script>
<script src="./store.js"></script>
<!-- spelformer.js: regelkärnan. Sedan AS-IA steg 2 (§2.8.2) ritas sidospelets
     RUNDHALVA här, via sidospel.js — uppsättningen bor i uppsattning.html. -->
<script src="./spelformer.js"></script>
<script src="./sidospel.js"></script>
<script src="./live.js"></script>
<script>
"use strict";
/* Enkel live-överblick UNDER rundan: ett scorekort som visar hur det går för
   mig och de andra i bollen, hål för hål och totalt. Djupanalysen (SG,
   insikter) bor i den kommande Analys-fliken (oversikt-analys.html).

   TRE KÄLLOR, EN MODELL. Kortet krävde förut en MOLNMATCH för att visa något
   alls — utan `gameId` ritades bara "Ingen live-match", och den vanligaste
   rundan av alla (du, telefonen, kanske ett sällskap) hade en tom Översikt hela
   vägen runt. "Live" betydde alltså "live för andra", aldrig för din egen
   score. Kortet byggs nu av det som FINNS, med en precedensregel per spelare:

     jag      → den lokala rundan (Store.active()). Telefonen ÄR källan; molnets
                rad för mig är en spegel som kan ligga efter (flygplansläge,
                tappat nät), så lokala hål vinner över molnets.
     de andra → molnets leaderboard, SGLive.subscribeLeaderboard(gameId, cb).
     markörer → matchens deltagare med egen scoretabell (Sällskap), som per
                definition aldrig har någon molnrad.

   Alla rader räknas om HÄR ur { spelarhål 1–18: score } + par, så Tot/hål/mot
   par betyder samma sak oavsett vilken källa scoren kom ifrån — molnets egen
   `toPar` beror på en par-tabell som skickades in vid prenumerationen och kunde
   glida isär från vyns. Par per spelarhål slås upp ur banans json + SGRound. */
const { GLOBAL_BASE, LOOP_SHORT } = SGRound;

let LIVE = null;   // matchen bor i Store (APPSTORE_PLAN §9.1); sätts i Store.ready()
const liveOn = () => !!(LIVE && LIVE.gameId && typeof SGLive !== "undefined");

let LB = null;            // senaste leaderboard-modellen
let myUid = null;         // egen uid → markera egen rad
let seq = [];             // spelarhål 1–18 i vald runda (globala nummer)
let parByRel = {};        // { spelarhål 1–18: par }
let lbSubscribed = false, lbUnsub = null;

function esc(s) { return String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const fmtDiff = d => d === 0 ? "E" : (d > 0 ? "+" + d : String(d));

/* ---------- score-notation ---------- */
// t = spelarens score på hålet, par = hålets par. Ritar form runt siffran.
function scoreCell(t, par) {
  if (!t) return `<td class="sc empty">·</td>`;
  if (par == null) return `<td class="sc">${t}</td>`;
  const d = t - par;
  let cls = "";                                   // par (0) → ingen form
  if (d <= -2) cls = "eagle";                     // eagle eller bättre (albatross ryms här)
  else if (d === -1) cls = "birdie";
  else if (d === 1) cls = "bogey";
  else if (d >= 2) cls = "dbl";                   // dubbelbogey eller sämre
  return `<td class="sc">${cls ? `<span class="mk ${cls}">${t}</span>` : t}</td>`;
}

/* ---------- bandata (par per spelarhål) ---------- */
let coursePromise = null;
function loadCourse() {
  if (coursePromise) return coursePromise;
  coursePromise = fetch("./data/" + SGRound.mobileJson(), { cache: "no-cache" })
    .then(r => r.json())
    .then(data => {
      const by = {};
      for (const h of data.holes) by[GLOBAL_BASE[h.loop] + h.hole] = h;
      return by;
    })
    .catch(() => ({}));   // par visas som – om bandata saknas
  return coursePromise;
}

/* ---------- live-prenumeration ---------- */
function startLeaderboard() {
  if (lbSubscribed || !liveOn()) return;
  lbSubscribed = true;
  SGLive.initLive().then(r => { myUid = r.uid; ritaKort(); }).catch(() => {});
  try {
    lbUnsub = SGLive.subscribeLeaderboard(LIVE.gameId, rows => {
      LB = rows; ritaKort();
    }, { par: parByRel });
  } catch (e) { lbSubscribed = false; }
}
window.addEventListener("pagehide", () => { if (lbUnsub) lbUnsub(); });

/* ---------- vyer ---------- */
// Visas bara när det inte finns NÅGOT att rita: ingen runda, ingen match,
// ingen score. En påbörjad runda ger alltid ett kort, om än ett tomt.
function emptyView() {
  return `<div class="card empty-cta">
    <span class="ico">📋</span>
    <p class="big">Ingen runda igång</p>
    <p class="txt">Starta en runda under <b>Logga slag</b> så visas ett
      live-scorekort här — hål för hål, uppdaterat medan du spelar. Lägg till
      medspelare i <b>Sällskap</b> så kommer de med på kortet, och går ni med i
      samma live-match under <b>Logga slag</b> syns hela bollens score i realtid.</p>
    <a class="btn" href="./spela.html">⛳ Gå till Logga slag</a>
  </div>`;
}

/* ---------- radmodellen (de tre källorna → en rad per spelare) ---------- */
// EN uträkning för alla rader: samma { hål: score } in, samma tre siffror ut.
function mkRow(o) {
  const holes = o.holes || {};
  let total = 0, thru = 0, toPar = 0;
  for (const k of Object.keys(holes)) {
    const t = holes[k];
    if (!(t > 0)) continue;
    total += t; thru += 1;
    if (parByRel[k] != null) toPar += t - parByRel[k];
  }
  return { uid: o.uid || null, name: o.name || "—", mine: !!o.mine,
           holes, total, thru, toPar };
}

// Mina spelade hål ur den lokala rundan, samma härledning som scorekortet i
// Logga slag och samma som live-pushen skickar (SGScore = en sanning).
function localHoles() {
  const d = Store.active();
  const m = {};
  if (!d) return m;
  for (const h of d.holes || []) {
    const c = SGScore.components(h);
    if (c.played) m[h.n] = c.total;
  }
  return m;
}

function myName() {
  const d = Store.active();
  const p = Store.profile ? Store.profile() : null;
  return (d && d.player) || (LIVE && LIVE.displayName) || (p && p.namn) || "Du";
}

function rader() {
  const cloud = (liveOn() && LB) ? LB : [];
  const meCloud = myUid ? cloud.find(p => p && p.uid === myUid) : null;
  const out = [];

  // Jag: molnraden som botten, mina lokala hål ovanpå (lokalt vinner).
  const mina = Object.assign({}, meCloud ? meCloud.holes : null, localHoles());
  if (Store.active() || meCloud) {
    out.push(mkRow({ uid: myUid, mine: true, holes: mina,
                     name: (meCloud && meCloud.name) || myName() }));
  }
  // De andra i molnmatchen.
  cloud.forEach(p => {
    if (!p || (meCloud && p.uid === meCloud.uid)) return;
    out.push(mkRow({ uid: p.uid, name: p.name, holes: p.holes }));
  });
  // Markörspelarna (Sällskap): score förd för hand, aldrig i molnet.
  Store.markers().forEach(p => {
    out.push(mkRow({ uid: p.id, name: p.name, holes: p.scores || {} }));
  });

  // Ställning som förut — men ospelade rader sjunker, annars lägger sig en
  // medspelare som inte börjat mitt i tabellen på ett falskt "E".
  return out.sort((a, b) =>
    (a.thru ? 0 : 1) - (b.thru ? 0 : 1) ||
    (a.toPar - b.toPar) || (a.total - b.total) ||
    (b.mine ? 1 : 0) - (a.mine ? 1 : 0) ||
    String(a.name).localeCompare(String(b.name), "sv"));
}

// summering av spelade hål i ett spann (spelarhål from..to, 1-baserat inkl.)
function sumHoles(p, from, to) {
  let s = 0;
  for (let r = from; r <= to; r++) if (p.holes && p.holes[r]) s += p.holes[r];
  return s;
}
function sumPar(from, to) {
  let s = 0, any = false;
  for (let r = from; r <= to; r++) if (parByRel[r] != null) { s += parByRel[r]; any = true; }
  return any ? s : null;
}
const sumCell = v => `<td class="sumcol">${v || "–"}</td>`;

function scorecardHtml(rows) {
  const kalla = liveOn() ? `kod ${esc(LIVE.code || "")}` : "din runda";
  const head = `<div class="card"><h2>🏆 Live-scorekort <span class="note">${kalla}</span></h2>`;
  if (!rows.length) {
    return head + `<div class="hint left">${
      liveOn() && !LB ? "Ansluter …" : "Ingen har fört score än."}</div></div>`;
  }

  const N = seq.length;
  const split = N > 9;                 // dela i Ut/In när rundan är längre än 9 hål
  const outTo = split ? 9 : N;         // sista hålet i "Ut"

  // header: hålnummer, "Ut" efter hål 9, resten, "In", "Tot" (slag), "+/−" (mot par)
  let holeHdr = "";
  seq.forEach((g, i) => {
    holeHdr += `<th class="hcol">${i + 1}</th>`;
    if (split && i + 1 === outTo) holeHdr += `<th class="sumcol">Ut</th>`;
  });
  if (split) holeHdr += `<th class="sumcol">In</th>`;

  // par-rad med samma summeringar
  let parCells = "";
  seq.forEach((g, i) => {
    const p = parByRel[i + 1];
    parCells += `<td class="hcol">${p != null ? p : "–"}</td>`;
    if (split && i + 1 === outTo) parCells += sumCell(sumPar(1, outTo));
  });
  if (split) parCells += sumCell(sumPar(outTo + 1, N));
  const totPar = sumPar(1, N);

  const body = rows.map(p => {
    const mine = p.mine;
    let cells = "";
    seq.forEach((g, i) => {
      const rel = i + 1;
      cells += scoreCell(p.holes ? p.holes[rel] : null, parByRel[rel]);
      if (split && rel === outTo) cells += sumCell(sumHoles(p, 1, outTo));
    });
    if (split) cells += sumCell(sumHoles(p, outTo + 1, N));
    const tpCls = p.thru && p.toPar < 0 ? "under" : p.thru && p.toPar > 0 ? "over" : "";
    const tp = p.thru ? fmtDiff(p.toPar) : "–";
    const full = esc(p.name || "—");
    const first = esc((p.name || "—").trim().split(/\s+/)[0] || "—");
    return `<tr class="${mine ? "me" : ""}">
      <td class="name"><span class="pn-full">${full}</span><span class="pn-first">${first}</span>${mine ? ' <span class="me-tag">(du)</span>' : ""}</td>
      ${cells}
      <td class="sumcol">${p.total || "–"}</td>
      <td class="tot totcol ${tpCls}">${tp}</td>
    </tr>`;
  }).join("");

  /* Foten säger varifrån resten av bollen ska komma. Den texten bodde förut i
     den tomma vyn — som nu bara syns när det inte finns någon runda alls. */
  let fot = "";
  if (rows.length < 2) {
    fot = `<p class="hint left" style="margin-top:10px">Bara du på kortet — lägg
      till medspelare under <b>Sällskap</b>, eller gå med i en live-match under
      <b>Logga slag</b> så syns hela bollen här.</p>`;
  } else if (!liveOn() && Store.markers().length) {
    fot = `<p class="hint left" style="margin-top:10px">Medspelarnas score för du
      själv — i <b>Sällskap</b> ovan.</p>`;
  }

  return head + `<div class="scroll"><table class="card-tbl">
    <thead>
      <tr><th class="name">Hål</th>${holeHdr}<th class="sumcol">Tot</th><th class="totcol">+/−</th></tr>
      <tr class="parrow"><td class="name">Par</td>${parCells}<td class="sumcol">${totPar || "–"}</td><td class="totcol">–</td></tr>
    </thead>
    <tbody>${body}</tbody>
  </table></div>${fot}</div>`;
}

/* Sidospelets rubrikrad + väg till uppsättningen (APPSTORE_PLAN §2.1c, §2.5).
   Kortet RÄKNAR ingenting — själva ställningen ritas av sidospel.js i
   #sidospel nedan. Uppsättningen (vilka som är med, spelform, ditt hcp) bor i
   uppsattning.html och KRÄVER INGEN AKTIV RUNDA. */
function sallskapHtml() {
  const f = Store.format();
  const n = 1 + Store.markers().length;
  const namn = f && Spelformer.FORMAT[f.key] ? Spelformer.FORMAT[f.key].namn : null;
  const rad = namn
    ? `<b style="font-size:16px">${esc(namn)}</b> · ${n} spelare`
    : `Köpenhamnare, Wolf, Skins och fler — lägg till medspelare och välj form.`;
  return `<div class="card"><h2>👥 Sällskap</h2>
    <p class="hint left" style="margin:0 0 10px">${rad}</p>
    <a class="btn" href="./uppsattning.html">${namn ? "Ändra uppsättning" : "Starta ett sidospel"}</a>
  </div>`;
}

/* Rundhalvan ritas EFTER att app.innerHTML satts, eftersom den behöver sitt
   element. Den ritar sig själv till tomhet när sällskapet är en enda spelare,
   så anropet är ofarligt även i en soloronda. */
function ritaSidospel() {
  const el = document.getElementById("sidospel");
  if (el && window.Sidospel) Sidospel.runda(el);
}

/* Bara scorekortet. Egen funktion — och synkron — eftersom den ritas om långt
   oftare än sidan: när molnet skickar, och när sällskapets score matas in i
   #sidospel strax ovanför. En full render() hade slagit sönder inmatningen
   under fingret (den ritar om sidospelet och tappar dess vy-läge). */
function ritaKort() {
  const el = document.getElementById("scorekort");
  if (!el) return;
  const rows = rader();
  const nagot = liveOn() || Store.active() || rows.some(r => r.thru > 0);
  el.innerHTML = nagot ? scorecardHtml(rows) : emptyView();
}

/* Sällskapets score matas in HÄR på sidan, i #sidospel. Utan den här kopplingen
   stod scorekortet kvar på gammal data tills sidan laddades om — "live" bara
   till namnet. Lyssnaren sitter på behållaren (som överlever sidospelets egna
   omritningar) och rör bara #scorekort, så den kan aldrig trigga sig själv.
   rAF: markörens score skrivs av sidospelets egen klickhandlare först. */
function foljSidospel() {
  const el = document.getElementById("sidospel");
  if (el) el.addEventListener("click", () => requestAnimationFrame(ritaKort));
}

async function render() {
  const roundName = SGRound.roundName();
  seq = SGRound.seq();
  const byGlobal = await loadCourse();
  parByRel = {};
  seq.forEach((g, i) => {
    const h = byGlobal[g];
    if (h && h.par != null) parByRel[i + 1] = h.par;
  });

  const igang = !!(liveOn() || Store.active());
  const app = document.getElementById("app");
  app.innerHTML = `<h1>Översikt</h1>
    <p class="sub">${igang ? `runda ${esc(roundName)} · live` : "Live-scorekort under rundan"}</p>
    ${sallskapHtml()}
    <div id="sidospel"></div>
    <div id="scorekort"></div>`;
  ritaSidospel();
  foljSidospel();
  ritaKort();

  if (liveOn()) startLeaderboard();   // prenumerera en gång när par-listan finns
}
const boot = () => Store.ready().then(() => { LIVE = Store.match(); render(); });
boot();
window.addEventListener("pageshow", boot);
</script>
<script>
/* Håll navigeringen inne i hemskärms-appen (iOS standalone): utan detta öppnar
   iOS länkar till andra sidor i en Safari-ruta. Vi fångar interna länkklick och
   navigerar via location, vilket behåller helskärmsläget. */
(function () {
  var standalone = ("standalone" in navigator && navigator.standalone)
    || matchMedia("(display-mode: standalone)").matches;
  if (!standalone) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    var url = new URL(a.getAttribute("href"), location.href);
    if (url.origin !== location.origin) return;
    e.preventDefault();
    location.href = url.href;
  });
})();
</script>
